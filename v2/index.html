<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connoisseur 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout : écran de salon. Scores à gauche, grande carte de jeu à droite, decks à finitions (irisé, métal, or…) ; une seule ambiance sombre assumée. */
:root{
  color-scheme:dark;
  --ink:#0f1118; --panel:#181b25; --raise:#212533; --line:#2c3142;
  --text:#f4f1e8; --muted:#9aa0b4; --dim:#5d6377;
  --sco:#4d8dff; --mat:#ff5d62; --pla:#ffc83d; --imp:#35d99a; --int:#b678ff; --fin:#f4f1e8;
  --on-card:#12131a;
  --ok:#35d99a; --ko:#ff5d62;
  --f-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:clamp(16px,3vw,40px);padding-block:20px 32px}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pla);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.05}
.app{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

/* ---------- Boutons ---------- */
.btn{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,background .12s}
.btn:hover{background:var(--line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--text);color:var(--on-card);border-color:var(--text)}
.btn.primary:hover{background:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.kbd{font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.55;font-weight:600}

/* ---------- Accueil ---------- */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{font-size:22px;font-weight:700}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.team-row{display:flex;gap:8px;align-items:center}
.team-row input[type=text]{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--ink) inset}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text);background:var(--raise)}
.field{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.seg button.on{background:var(--text);color:var(--on-card);border-color:var(--text)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:4px;accent-color:var(--pla);width:16px;height:16px;flex:none}
.check small{display:block;color:var(--muted)}
.report{border-radius:10px;padding:12px;background:var(--raise);font-size:14px}
.report ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.format{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.format table{border-collapse:collapse;font-size:13px;width:100%;min-width:420px}
.format th,.format td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.format th{background:var(--raise);font-weight:700}
.format tr:last-child td{border-bottom:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--ko);font-weight:600}

/* ---------- Jeu ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{font-size:20px}
.scores{display:flex;flex-wrap:wrap;gap:8px}
.game{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:1fr}}
.scoreboard{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;border:1px solid transparent}
.srow.cur{border-color:var(--text);background:var(--raise)}
.srow .pawn-s{width:26px;height:26px;border-radius:50%;border:3px solid var(--panel)}
.srow .nm{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2vw,24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .pts{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,4vw,52px);line-height:1;font-variant-numeric:tabular-nums}
.srow .pts small{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.srow .bar{grid-column:2/4;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.srow .bar i{display:block;height:100%;border-radius:999px;transition:width .4s}
.round{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ranking{display:flex;flex-direction:column;gap:6px;min-width:min(420px,100%)}
.ranking div{display:flex;justify-content:space-between;gap:16px;font-size:18px;border-bottom:1px solid var(--line);padding:6px 0;font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.turn{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.turn b{color:var(--text);font-size:20px;font-family:var(--f-display)}
.turn .pawn-s{width:22px;height:22px;border-radius:50%;border:3px solid var(--panel);flex:none}
.flash{font-size:14px;color:var(--muted);min-height:20px}
.flash b{color:var(--text)}
.card{border-radius:22px;padding:clamp(20px,3vw,32px);color:var(--on-card);display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px -20px rgba(0,0,0,.7);position:relative;overflow:hidden}
.card .cat{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.card .ask{font-size:clamp(18px,2vw,22px);font-weight:600}
.card .theme{font-size:clamp(34px,5vw,64px);font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.card .bignum{font-family:var(--f-display);font-weight:800;font-size:clamp(72px,10vw,128px);line-height:.85;position:absolute;right:20px;top:14px;opacity:.18;font-variant-numeric:tabular-nums}
.card .q{font-size:clamp(22px,2.6vw,32px);font-weight:700;line-height:1.25;max-width:30ch;position:relative}
.card .a{background:var(--on-card);color:var(--text);border-radius:14px;padding:14px 18px;font-size:clamp(20px,2.4vw,28px);font-weight:700}
.card .a small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .note{font-size:14px;font-weight:600;opacity:.75}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{border:2px solid var(--on-card);background:transparent;color:var(--on-card);border-radius:12px;aspect-ratio:1.35;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,34px);transition:background .1s,color .1s}
.lv:hover:not([disabled]){background:var(--on-card);color:var(--text)}
.lv[disabled]{opacity:.25;cursor:not-allowed;text-decoration:line-through}
.timer{height:10px;background:rgba(18,19,26,.18);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--on-card);border-radius:999px;transition:width .2s linear}
.timer-row{display:flex;align-items:center;gap:12px;font-weight:700;font-variant-numeric:tabular-nums}
.timer-row .timer{flex:1}
.timer-row.out{color:#7a0b10}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{font-size:17px;padding:12px 20px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-card)}
.btn.ko{background:var(--ko);border-color:var(--ko);color:var(--on-card)}
.card .btn.dark{background:var(--on-card);color:var(--text);border-color:var(--on-card)}
.card .link{background:none;border:0;color:var(--on-card);text-decoration:underline;font-weight:600;padding:0;align-self:flex-start;font-size:14px;opacity:.75}
.final-card{background:var(--fin)}
.final-card::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:repeating-linear-gradient(90deg,var(--sco) 0 25%,var(--mat) 25% 50%,var(--pla) 50% 75%,var(--imp) 75% 100%)}
.shortcuts{font-size:13px;color:var(--dim)}

/* ---------- Victoire ---------- */
.win{min-height:70vh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:20px}
.win .label{color:var(--pla)}
.win h1{font-size:clamp(48px,10vw,140px);font-weight:800;letter-spacing:-.03em}
.confetti{display:flex;gap:8px}
.confetti span{width:clamp(30px,5vw,60px);aspect-ratio:1;border-radius:12px;animation:pop .6s ease-out both}
.confetti span:nth-child(2){animation-delay:.08s}.confetti span:nth-child(3){animation-delay:.16s}.confetti span:nth-child(4){animation-delay:.24s}
@keyframes pop{from{transform:scale(.3) rotate(-20deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ---------- Finitions ---------- */
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);background-size:260% 100%;background-position:130% 0;mix-blend-mode:soft-light;pointer-events:none;animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%{background-position:130% 0}55%,100%{background-position:-130% 0}}
.glow{box-shadow:0 0 34px -4px #ff4fb0,0 0 0 1px rgba(255,255,255,.35) inset}
.fmt summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.fmt[open] summary{margin-bottom:10px}
.fmt .hint{margin-top:10px}
.link-btn{background:none;border:0;color:var(--text);text-decoration:underline;padding:0;font-size:inherit}

/* ---------- Accueil ---------- */
.home{min-height:calc(100vh - 80px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center;gap:40px}
.home h1{font-size:clamp(52px,8.5vw,120px);font-weight:800;letter-spacing:-.035em;line-height:.95}
.home h1 em{font-style:normal;background:var(--text);color:var(--ink);padding:0 .12em;border-radius:.08em;margin-right:.04em}
.home p{color:var(--muted);max-width:40ch;font-size:18px;margin:20px 0 34px}
.home-choice{display:flex;flex-wrap:wrap;gap:14px;max-width:560px}
.choice{flex:1 1 200px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:4px;transition:transform .15s,background .15s,border-color .15s}
.choice b{font-family:var(--f-display);font-size:28px;font-weight:800}
.choice span{color:var(--muted);font-size:14px}
.choice:hover{transform:translateY(-3px);border-color:var(--text);background:var(--raise)}
.fan{position:relative;height:360px;display:grid;place-items:center}
.fan-pack{position:absolute;width:180px;aspect-ratio:5/7.4;border-radius:6px 6px 8px 8px;color:var(--on-card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:18px 14px;transform:translateX(var(--x)) rotate(var(--r));box-shadow:0 24px 44px -18px rgba(0,0,0,.95),inset 0 0 0 1px rgba(255,255,255,.25);overflow:hidden}
.fan-pack:nth-child(2){z-index:2;transform:translateX(var(--x)) rotate(var(--r)) translateY(-16px)}
.fan-pack > *:not(.crimp){position:relative;z-index:1}
.fan-pack .pk-name{font-size:24px}
@media (max-width:800px){.home{grid-template-columns:1fr;min-height:auto;padding-top:10px}.fan{order:-1;height:220px}.fan-pack{width:120px}.fan-pack .pk-name{font-size:17px}}

/* ---------- Étapes ---------- */
.step-head{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.step-head .btn{margin-bottom:6px}
.step-title{font-size:clamp(34px,5vw,58px);font-weight:800;letter-spacing:-.025em}
.step-head .hint{font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 240px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.bottom-bar{position:sticky;bottom:env(safe-area-inset-bottom,0px);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:22px 0 14px;background:linear-gradient(180deg,transparent,var(--ink) 34%);z-index:5}
.btn.big{font-size:18px;padding:14px 26px;font-family:var(--f-display);margin-left:auto}
.sel{color:var(--muted)} .sel b{color:var(--text)}

/* ---------- Boosters ---------- */
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:24px 18px;padding:8px 8px 0 0}
.pack-wrap{position:relative;min-width:0}
.pack{position:relative;overflow:hidden;width:100%;aspect-ratio:5/7.4;border:0;border-radius:6px 6px 8px 8px;padding:22px 12px 20px;color:var(--on-card);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;box-shadow:0 12px 26px -14px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.25);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.pack > *:not(.crimp){position:relative;z-index:1}
@media (hover:hover){.pack:hover{transform:translateY(-6px) scale(1.03)}}
.pack-wrap.on .pack{box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--text),0 16px 30px -14px rgba(0,0,0,.95)}
.crimp{position:absolute;left:0;right:0;top:0;height:12px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,rgba(255,255,255,.28) 2px 4px);border-bottom:1px solid rgba(0,0,0,.18);z-index:2}
.crimp.bottom{top:auto;bottom:0;border-bottom:0;border-top:1px solid rgba(0,0,0,.18)}
.pk-brand{font-family:var(--f-display);font-weight:800;font-size:10px;letter-spacing:.14em;margin-top:6px}
.pk-name{font-family:var(--f-display);font-weight:800;font-size:clamp(17px,1.8vw,21px);line-height:1;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.pk-foot{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px;opacity:.75}
.pk-toggle{position:absolute;right:-9px;top:-9px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:var(--raise);color:var(--text);font-weight:800;font-size:17px;line-height:1;z-index:3;display:grid;place-items:center;transition:transform .15s}
.pk-toggle:hover{transform:scale(1.12)}
.pack-wrap.on .pk-toggle{background:var(--text);color:var(--on-card)}

/* ---------- Unboxing ---------- */
.unbox{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 35%,rgba(40,44,62,.92),rgba(6,7,10,.96) 70%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-x:hidden;overflow-y:auto;opacity:0;transition:opacity .25s}
.unbox.in{opacity:1}
.ub-dialog{position:relative;width:min(980px,100%);display:flex;flex-direction:column;gap:22px;align-items:center}
.ub-close{position:absolute;top:0;right:0;z-index:6}
.ub-stage{position:relative;width:100%;min-height:440px;display:grid;place-items:center;justify-items:center}
.ub-stage > *{grid-area:1/1}
/* rayons et étincelles */
.ub-rays{position:absolute;left:50%;top:50%;translate:-50% -50%;width:140vmin;height:140vmin;max-width:900px;max-height:900px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.17) 0 5deg,transparent 5deg 16deg);-webkit-mask:radial-gradient(circle,#000 0%,transparent 60%);mask:radial-gradient(circle,#000 0%,transparent 60%);opacity:0;transform:scale(.25);transition:opacity .6s,transform .9s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.burst .ub-rays{opacity:1;transform:scale(1);animation:spin 16s linear infinite}
@keyframes spin{to{rotate:360deg}}
.ub-burst{position:absolute;left:50%;top:calc(50% - 150px);width:0;height:0;pointer-events:none;z-index:4}
.spark{position:absolute;left:0;top:0;width:var(--s);height:var(--s);border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 20px var(--pla);opacity:0}
.spark:nth-child(3n){background:var(--pla)}
.spark:nth-child(3n+1){background:#9fe6ff;box-shadow:0 0 10px #9fe6ff,0 0 20px #ff7ab6}
.burst .spark{animation:spark calc(1s * var(--k,1)) cubic-bezier(.1,.7,.3,1) calc(var(--t) * var(--k,1)) forwards}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.2)}}
/* le paquet */
.ub-pack{position:relative;z-index:3;width:min(250px,62vw);aspect-ratio:5/7.4;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 26px 28px rgba(0,0,0,.75));transition:transform .5s cubic-bezier(.3,.7,.3,1),opacity .4s}
@media (hover:hover){.ub-pack:hover{transform:scale(1.02)}}
.ub-pack:focus-visible{outline:3px solid var(--pla);outline-offset:6px;border-radius:8px}
.ub-piece{position:absolute;inset:0;border-radius:6px 6px 8px 8px;color:var(--on-card);overflow:hidden}
.ub-body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:30% 14px 22px}
.ub-body > *:not(.crimp):not(.ub-glow){position:relative;z-index:1}
.ub-body .pk-name{font-size:clamp(24px,3vw,30px)}
.ub-top{z-index:2;transform-origin:100% 20%;transition:transform calc(.8s * var(--k,1)) cubic-bezier(.4,-.25,.6,1),opacity calc(.8s * var(--k,1))}
.ub-notch{position:absolute;left:10px;top:12.5%;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.65;z-index:1}
.ub-glow{position:absolute;left:-15%;right:-15%;top:8%;height:46%;background:radial-gradient(ellipse at 50% 10%,#fff 0%,rgba(255,255,255,.75) 22%,rgba(255,255,255,0) 70%);opacity:0;transition:opacity .35s;z-index:2}
.ub-line{position:absolute;inset:0;width:100%;height:100%;z-index:4;overflow:visible;pointer-events:none}
.ub-line .guide{fill:none;stroke:rgba(18,19,26,.5);stroke-width:1.4;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.ub-cut{position:absolute;inset:0;width:100%;height:100%;z-index:5;overflow:visible;pointer-events:none;clip-path:inset(-20% calc(100% - var(--p,0) * 100%) -20% -4%);transition:clip-path var(--lineMs,500ms) linear}
.ub-cut polyline{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 9px #ffc83d)}
.dragging .ub-cut{transition:none}
.dragging .ub-pack{animation:jitter .1s linear infinite;cursor:grabbing}
@keyframes jitter{50%{transform:translate(.8px,-.6px) rotate(-.4deg)}}
.tearing .ub-pack{animation:shake .5s}
@keyframes shake{15%{transform:rotate(-3deg)}35%{transform:rotate(2.5deg) translateY(2px)}55%{transform:rotate(-2deg)}75%{transform:rotate(1deg)}}
.torn .ub-top{transform:translate(90px,-230px) rotate(42deg);opacity:0}
.torn .ub-line,.torn .ub-cut{opacity:0;transition:opacity .25s}
.torn .ub-glow{opacity:1}
.burst .ub-pack{transform:translateY(70px) scale(.9);opacity:.0;transition-delay:.25s}
.ub-hint{align-self:end;margin:0;color:var(--muted);font-size:14px;transition:opacity .2s}
.tearing .ub-hint{opacity:0}
.opened .ub-pack,.opened .ub-hint{display:none}
/* les cartes */
.ub-cards{display:none;position:relative;z-index:5;width:100%;max-width:100%;grid-template-columns:repeat(auto-fit,minmax(118px,150px));justify-content:center;gap:16px;perspective:1300px}
.opened .ub-cards{display:grid}
.ub-card{aspect-ratio:63/88;opacity:0;animation:rise calc(.7s * var(--k,1)) cubic-bezier(.2,.9,.25,1.15) forwards;animation-delay:calc(var(--i) * var(--stag,160ms) * var(--k,1))}
@keyframes rise{0%{opacity:0;transform:translateY(200px) scale(.45) rotate(var(--r))}60%{opacity:1}100%{opacity:1;transform:none}}
.ub-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(180deg);animation:flip calc(.7s * var(--k,1)) cubic-bezier(.3,.7,.3,1) forwards;animation-delay:calc((var(--i) * var(--stag,160ms) + 650ms) * var(--k,1))}
@keyframes flip{0%{transform:rotateY(180deg)}70%{transform:rotateY(-12deg) scale(1.08)}100%{transform:rotateY(0) scale(1)}}
.ub-back,.ub-front{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px;overflow:hidden}
.ub-back{transform:rotateY(180deg);justify-content:center;background:repeating-linear-gradient(45deg,var(--panel) 0 10px,var(--raise) 10px 20px);border:2px solid var(--line)}
.ub-front{color:var(--on-card);justify-content:space-between;box-shadow:inset 0 0 0 2px rgba(18,19,26,.85),inset 0 0 0 6px rgba(255,255,255,.35),0 18px 34px -14px rgba(0,0,0,.95)}
.ub-front > *{position:relative;z-index:1}
.ub-front b{font-family:var(--f-display);font-size:clamp(19px,2vw,23px);line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
.ub-front .meta{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.ub-front .holo{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.9) 44%,rgba(160,230,255,.7) 50%,rgba(255,170,230,.7) 56%,transparent 70%);background-size:260% 100%;background-position:160% 0;mix-blend-mode:overlay;animation:holo calc(1.1s * var(--k,1)) ease-out forwards;animation-delay:calc((var(--i) * var(--stag,160ms) + 1150ms) * var(--k,1))}
@keyframes holo{to{background-position:-160% 0}}
.quick .ub-card{animation-duration:.4s;animation-delay:calc(var(--i) * 70ms)}
.quick .ub-inner{animation-duration:.45s;animation-delay:calc(var(--i) * 70ms + 200ms)}
.quick .ub-front .holo{animation-delay:calc(var(--i) * 70ms + 450ms)}
.quick .ub-rays{opacity:.6;transform:scale(1);animation:spin 16s linear infinite}
/* infos */
.ub-info{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;opacity:0;transform:translateY(12px);transition:opacity .45s,transform .45s;pointer-events:none}
.done .ub-info{opacity:1;transform:none;pointer-events:auto}
.ub-info h3{font-size:clamp(26px,3vw,34px);font-weight:800}
.ub-info p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.ub-card{opacity:1}.ub-inner{transform:none}.ub-rays{display:none}}

/* ---------- Carte de jeu format TCG ---------- */
.tcg{position:relative;overflow:hidden;width:min(100%,470px);aspect-ratio:63/88;margin:0 auto;border-radius:20px;padding:12px;box-shadow:0 26px 50px -24px rgba(0,0,0,.95),inset 0 0 0 1px rgba(255,255,255,.3);color:var(--on-card)}
.tcg-in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:7px;background:#f3eee0;border-radius:12px;padding:9px;box-shadow:inset 0 0 0 2px rgba(18,19,26,.85)}
.tcg-title{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fbf8ef;border:2px solid var(--on-card);border-radius:10px;padding:6px 6px 6px 12px}
.tcg-title h2{font-size:clamp(19px,2.2vw,24px);font-weight:800;letter-spacing:-.01em;line-height:1.05;overflow-wrap:anywhere}
.cost{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;border:2px solid var(--on-card);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.tcg-art{position:relative;overflow:hidden;flex:1 1 auto;min-height:150px;border:2px solid var(--on-card);border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:14px 16px;box-shadow:inset 0 0 40px rgba(0,0,0,.18)}
.tcg-art > *{position:relative;z-index:1}
.art-kicker{font-size:14px;font-weight:700}
.art-theme{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,4.6vw,54px);line-height:.95;letter-spacing:-.025em;overflow-wrap:anywhere;text-wrap:balance}
.art-num{font-family:var(--f-display);font-weight:800;font-size:clamp(88px,12vw,140px);line-height:.8;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tcg-type{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:#fbf8ef;border:2px solid var(--on-card);border-radius:7px;padding:5px 10px}
.tcg-type span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tcg-text{background:#fbf8ef;border:2px solid var(--on-card);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tcg-q{margin:0;font-size:clamp(18px,2.1vw,23px);font-weight:700;line-height:1.25}
.tcg-a{background:var(--on-card);color:var(--text);border-radius:8px;padding:10px 14px;font-size:clamp(18px,2.1vw,23px);font-weight:700}
.tcg-a small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tcg-levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.gem{aspect-ratio:1;border-radius:50%;border:2px solid var(--on-card);background:#fff;color:var(--on-card);font-family:var(--f-display);font-weight:800;font-size:clamp(17px,2.2vw,22px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .1s,background .1s,color .1s}
.gem:hover:not([disabled]){background:var(--on-card);color:var(--text);transform:translateY(-2px)}
.gem[disabled]{opacity:.25;cursor:not-allowed}
.tcg-foot{display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.7;padding:0 4px}
.tcg .timer-row{font-size:14px}
.tcg-actions{justify-content:center}
.tcg-actions .btn{font-size:17px;padding:12px 22px}
.tcg.deal{animation:dealcard .55s cubic-bezier(.2,.8,.2,1)}
@keyframes dealcard{from{opacity:0;transform:perspective(900px) rotateY(-80deg) translateX(60px)}to{opacity:1;transform:none}}
@media (max-width:900px){
  .side.play{order:-1}
  .scoreboard{padding:10px;gap:4px}
  .srow{padding:8px 10px;gap:10px}
  .srow .nm{font-size:16px}
  .srow .pts{font-size:26px}
  .srow .bar{height:4px}
  .tcg{padding:9px;border-radius:16px}
  .tcg-art{min-height:120px}
}

/* ---------- Panneau dev ---------- */
.dev-btn{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80;border:1px solid var(--line);background:var(--raise);color:var(--muted);border-radius:8px;padding:6px 9px;font-size:11px;font-weight:800;letter-spacing:.1em}
.dev-btn:hover,.dev-btn[aria-expanded="true"]{color:var(--on-card);background:var(--pla);border-color:var(--pla)}
.dev{position:fixed;left:12px;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:80;width:min(320px,calc(100vw - 24px));max-height:calc(100vh - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.9);font-size:14px}
.dev h4{margin:0;font-family:var(--f-display);font-size:16px;display:flex;justify-content:space-between;align-items:center}
.dev .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dev .row span{color:var(--muted)}
.dev .row b{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px;text-align:right}
.dev input[type=range]{flex:1;accent-color:var(--pla);min-width:0}
.dev input[type=checkbox]{accent-color:var(--pla);width:16px;height:16px}
.dev select{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.dev .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.dev .grid2 label{display:flex;gap:8px;align-items:center;color:var(--text)}
.dev .sep{height:1px;background:var(--line)}
.dev .actions{gap:8px}
.dev .toast{color:var(--imp);font-size:13px;min-height:16px}
html.dev-on .bottom-bar{padding-left:56px}
html.no-rays .ub-rays{display:none}
html.no-sparks .ub-burst{display:none}
html.no-holo .holo{display:none}
html.no-sheen .shine::after{display:none}
html.no-deal .tcg.deal{animation:none}
html.no-shake .tearing .ub-pack,html.no-shake .dragging .ub-pack{animation:none}
html.no-glow .ub-glow{display:none}

/* ---------- Logo (un seul style partout) ---------- */
.logo{--lf:var(--text);--lb:var(--ink);display:inline-flex;align-items:center;font-family:var(--f-display);font-weight:800;font-style:normal;letter-spacing:.14em;line-height:1;text-transform:uppercase;color:var(--lf);white-space:nowrap}
.logo em{font-style:normal;background:var(--lf);color:var(--lb);padding:.18em .28em .16em;border-radius:.18em;margin-right:.12em;letter-spacing:.14em}
.pk-brand.logo,.tcg-foot .logo{--lf:var(--on-card);--lb:#fbf8ef}
.ub-back .logo{--lf:var(--muted);--lb:var(--panel);font-size:11px}
.home-logo{font-size:13px;margin-bottom:18px}
/* ---------- Boutons de jeu toujours visibles ---------- */

/* ---------- Carte : question dans l'illustration ---------- */
.art-q{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.2vw,34px);line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.art-q.long{font-size:clamp(21px,2.7vw,29px)}
.art-q.xl{font-size:clamp(18px,2.3vw,24px)}
.tcg-art.is-q{justify-content:center;gap:10px}
.tcg-art.is-q .art-kicker{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.tcg .btn.dark{background:var(--on-card);color:var(--text);border-color:var(--on-card)}
.tcg .btn.wide{width:100%;justify-content:center;font-size:17px;padding:13px}
.tcg-verdict{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcg-verdict .btn{justify-content:center;font-size:17px;padding:13px 10px}
.tcg .kbd{display:none}
@media (hover:hover) and (pointer:fine){.tcg .kbd{display:inline}}
/* ---------- Burger ---------- */
.turn{position:relative}
.turn .who{flex:1;min-width:0}
.burger-wrap{position:relative;margin-left:auto}
.burger{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-content:center;gap:4px;padding:0}
.burger i{display:block;width:18px;height:2px;border-radius:2px;background:var(--text)}
.burger[aria-expanded="true"]{background:var(--text)}
.burger[aria-expanded="true"] i{background:var(--ink)}
.menu-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:min(260px,80vw);background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;box-shadow:0 20px 40px -16px rgba(0,0,0,.9)}
.menu-item{background:none;border:0;text-align:left;padding:12px 12px;border-radius:9px;font-weight:600;font-size:15px}
.menu-item:hover:not([disabled]){background:var(--line)}
.menu-item[disabled]{opacity:.35;cursor:not-allowed}
.menu-note{margin:4px 12px 8px;font-size:12px;color:var(--dim)}
.topbar{margin-bottom:-6px}
.game .flash:empty{display:none}

/* ---------- Bandeau de scores compact ---------- */
.strip{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:center}
.strip::-webkit-scrollbar{display:none}
.chip{position:relative;flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;overflow:hidden;max-width:46vw}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.chip b{font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.chip .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--c);transition:width .6s}
.chip.cur{border-color:var(--text);background:var(--raise)}
.chip.cur .nm{color:var(--text)}
.strip-info{flex:none;font-size:12px;color:var(--dim);padding-left:2px}
@media (max-width:900px){
  .strip{display:flex}
  .game > .side:not(.play){display:none}
  .game-top{display:none}
  .game{gap:12px}
  .side.play{gap:10px}
  .turn{font-size:14px}
  .turn b{font-size:18px}
}
/* ---------- Écran de score entre deux questions ---------- */
.recap{width:min(100%,470px);margin:0 auto;display:flex;flex-direction:column;gap:18px;padding:6px 0 10px;animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
.rc-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.rc-delta{font-family:var(--f-display);font-weight:800;font-size:clamp(84px,18vw,140px);line-height:.9;letter-spacing:-.04em;color:var(--c,var(--text));animation:boom .6s cubic-bezier(.2,1.6,.4,1)}
.rc-delta.con{color:var(--ko)}
.rc-delta.miss{color:var(--dim)}
@keyframes boom{from{transform:scale(.3);opacity:0}}
.rc-line{margin:0;color:var(--muted);font-size:17px}
.rc-line b{color:var(--text)}
.rc-board{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.rc-row{position:relative;display:grid;grid-template-columns:22px 14px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ink);will-change:transform}
.rc-row.me{box-shadow:inset 0 0 0 2px var(--c)}
.rc-pos{font-family:var(--f-display);font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
.rc-row .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.rc-row .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-mv{font-size:12px;font-weight:800;opacity:0;transition:opacity .3s .5s}
.rc-row.moved .rc-mv{opacity:1}
.rc-mv.up{color:var(--ok)}
.rc-mv.down{color:var(--ko)}
.rc-pts{font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.rc-pts.pop{animation:pop2 .35s}
@keyframes pop2{50%{transform:scale(1.35)}}
.rc-bar{grid-column:3/6;height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.rc-bar i{display:block;height:100%;background:var(--c);border-radius:999px}
.rc-next{margin:0 auto;width:100%;justify-content:center}
.game .flash:empty{display:none}
.rc-head.still .rc-delta{animation:none}

/* ---------- Équilibre de la carte ---------- */
.tcg-art{justify-content:center;align-items:center;text-align:center;gap:8px}
.tcg-art.is-q{align-items:stretch;text-align:left}
.art-sub{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin-top:4px}
.tcg-title h2.set{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-family:var(--f-body)}
.tcg-levels{gap:6px}
.gem{aspect-ratio:1.3;border-radius:999px}
/* ---------- Barre du bas opaque ---------- */
.bottom-bar{background:var(--ink);border-top:1px solid var(--line);margin-inline:calc(-1 * clamp(16px,3vw,40px));padding:12px clamp(16px,3vw,40px) calc(13px + env(safe-area-inset-bottom,0px));bottom:-2px;margin-top:8px;box-shadow:0 -14px 24px -12px rgba(0,0,0,.8),0 40px 0 0 var(--ink)}
html.dev-on .bottom-bar{padding-left:calc(clamp(16px,3vw,40px) + 56px)}
.packs{padding-bottom:12px}

/* ---------- Carte un peu plus haute, bloc centré sur téléphone ---------- */
.tcg{aspect-ratio:63/94}
@media (max-width:900px){
  .side.play{min-height:calc(100dvh - 52px)}
  .play-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;flex-direction:column;gap:10px;background:var(--ink);padding:8px 0 6px;margin-top:-8px}
  .play-body{flex:1;display:flex;flex-direction:column;justify-content:center}
}
.play-head{display:flex;flex-direction:column;gap:12px}
.play-body{display:flex;flex-direction:column}

/* ---------- Burger en face des joueurs ---------- */
.head-row{display:flex;align-items:center;gap:8px}
.head-row .strip{flex:1;min-width:0}
.head-row .burger-wrap{margin-left:auto;flex:none}
.head-row .burger{width:40px;height:40px}
/* ---------- Accueil : de l'air sous les boutons ---------- */
.pk-mid{display:flex;flex-direction:column;align-items:center;gap:7px}
.pk-desc{font-size:11px;font-weight:600;line-height:1.25;opacity:.75;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}

/* ---------- Téléphone : tout tient sans scroller ---------- */
@media (max-width:800px){

  .step-head{flex-direction:row;flex-wrap:wrap;align-items:center;column-gap:12px;row-gap:6px}
  .step-head .btn{margin-bottom:0}
  .step-title{flex-basis:100%;font-size:30px}
  .step-head .hint{flex-basis:100%;font-size:14px;margin:0}
  .app{gap:16px}
  .setup{gap:12px}
  .panel{padding:14px;gap:11px;border-radius:14px}
  .panel h2{font-size:18px}
  .field{gap:6px}
  .team-row input[type=text]{padding:8px 11px}
  .seg button{padding:6px 12px}
  .bottom-bar{padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .btn.big{padding:12px 22px;font-size:17px}
}
@media (max-width:800px){
  .screen-fill{min-height:calc(100dvh - 30px);display:flex;flex-direction:column;gap:16px}

  .panel-players .add-team{margin-top:auto}

  .screen-fill .bottom-bar{margin-top:0}
}
.plus-wrap{position:relative;margin-left:auto}
.plus-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--raise);font-size:24px;font-weight:600;line-height:1;display:grid;place-items:center;padding:0 0 2px}
.plus-btn[aria-expanded="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.import-pop{width:min(340px,calc(100vw - 32px))}
.import-pop a.menu-item{color:var(--text);text-decoration:none}
.import-pop .fmt{padding:6px 12px 10px}
.import-pop .format table{min-width:380px}
/* ---------- Accueil plein écran, hiérarchisé ---------- */
@media (max-width:800px){
  .home{display:flex;flex-direction:column;min-height:calc(100dvh - 30px);gap:22px;padding:0}
  .fan{order:-1;flex:1 1 auto;height:auto;min-height:clamp(190px,32vh,300px)}
  .fan-pack{width:clamp(104px,30vw,138px);padding:14px 10px;gap:9px}
  .fan-pack .pk-name{font-size:clamp(15px,4.4vw,19px)}
  .fan-pack .pk-brand{font-size:9px}
  .home-text{display:flex;flex-direction:column}
  .home-logo{margin-bottom:14px;font-size:12px}
  .home h1{font-size:clamp(50px,15vw,72px);line-height:.92}
  .home p{font-size:16px;margin:16px 0 26px;max-width:32ch}
  .home-choice{flex-direction:column;flex-wrap:nowrap;gap:10px;max-width:none;margin-bottom:62px}
  .choice{flex:none;flex-direction:row;align-items:baseline;justify-content:space-between;gap:10px;padding:18px 18px}
  .choice b{font-size:24px}

}

/* ---------- Écran de score : fenêtre centrée sur le joueur ---------- */
.rc-list{position:relative;display:flex;flex-direction:column;gap:8px;max-height:max(176px,calc(100dvh - 450px));overflow-y:auto;scrollbar-width:none;padding:2px;margin:-2px;overscroll-behavior:contain}
.rc-list::-webkit-scrollbar{display:none}
.rc-list.ft{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 64px,#000 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 64px,#000 100%)}
.rc-list.fb{-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 64px),transparent 100%);mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 64px),transparent 100%)}
.rc-list.ft.fb{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 64px,#000 calc(100% - 64px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 64px,#000 calc(100% - 64px),transparent 100%)}
.rc-next{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -10px 24px 6px var(--ink)}
@media (min-width:901px){.rc-list{max-height:min(420px,calc(100vh - 380px))}}

/* =====================================================================
   CONNOISSEUR 2.0 · Design system néo-brutaliste
   Fond crème, contours noirs épais, ombres décalées dures, aplats vifs.
   Thème unique clair assumé.
   ===================================================================== */
:root{
  color-scheme:light;
  --ink:#FFF4DF; --panel:#FFFFFF; --raise:#FFE9B8; --line:#111111;
  --text:#111111; --muted:#4B4740; --dim:#857E70;
  --sco:#2E5BFF; --mat:#FF5B2E; --pla:#FFC83A; --imp:#1CC7A8; --int:#8B6CFF; --fin:#FFFFFF;
  --pink:#FF6FB5;
  --on-card:#111111; --ok:#1CC7A8; --ko:#FF4F4F;
  --bd:2.5px solid #111111; --bd-thin:2px solid #111111;
  --sh:4px 4px 0 #111111; --sh-lg:6px 6px 0 #111111; --sh-sm:3px 3px 0 #111111;
  --r:14px; --r-sm:10px;
  --f-display:"Archivo", "Arial Black", system-ui, sans-serif;
  --f-body:"Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
}
body{background-color:var(--ink);background-image:radial-gradient(rgba(17,17,17,.13) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--text)}
::selection{background:var(--pla);color:#111}
:focus-visible{outline:3px solid var(--sco);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em}

/* ---------- Boutons ---------- */
.btn{border:var(--bd);background:var(--panel);color:var(--text);border-radius:var(--r-sm);box-shadow:var(--sh-sm);font-weight:700;transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--raise)}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:0 0 0 #111}
.btn.primary,.btn.primary:hover{background:var(--pla);color:#111;border-color:#111}
.btn.primary:hover{filter:brightness(1.04)}
.btn.ghost{background:var(--panel)}
.btn.ok,.btn.ok:hover{background:var(--imp);color:#111;border-color:#111}
.btn.ko,.btn.ko:hover{background:var(--ko);color:#111;border-color:#111}
.tcg .btn.dark,.btn.dark{background:#111;color:#fff;border-color:#111}
.btn.big{font-family:var(--f-display);font-weight:800;box-shadow:var(--sh)}
.btn[disabled]{opacity:.45;box-shadow:none}
.kbd{border-width:1.5px;opacity:.6}
.icon-btn{border:var(--bd-thin);background:var(--panel);color:var(--text);border-radius:var(--r-sm);box-shadow:2px 2px 0 #111}
.icon-btn:hover{background:var(--raise);color:var(--text)}
.icon-btn[disabled]{opacity:.35;box-shadow:none}

/* ---------- Logo ---------- */
.logo{--lf:#111;--lb:var(--pla)}
.logo em{border:2px solid #111;box-shadow:2px 2px 0 #111;border-radius:6px}
.pk-brand.logo,.tcg-foot .logo{--lf:#111;--lb:#fff}
.pk-brand.logo em,.tcg-foot .logo em{box-shadow:none;border-width:1.5px}
.ub-back .logo{--lf:#111;--lb:var(--pla)}

/* ---------- Accueil ---------- */
.home h1{font-weight:900;letter-spacing:-.04em}
.home h1 em{background:var(--pla);color:#111;border:3px solid #111;box-shadow:5px 5px 0 #111;border-radius:.12em;padding:0 .1em;display:inline-block;transform:rotate(-2deg);margin:0 .06em .06em 0}
.home p{color:var(--muted)}
.choice{background:var(--panel);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);color:var(--text)}
.choice:nth-child(1){background:var(--mat)}
.choice:nth-child(2){background:var(--imp)}
.choice b{color:#111}
.choice span{color:#111;opacity:.8;font-weight:600}
.choice:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-lg);border-color:#111;background:inherit}
.choice:nth-child(1):hover{background:var(--mat)}
.choice:nth-child(2):hover{background:var(--imp)}
.choice:active{transform:translate(4px,4px);box-shadow:0 0 0 #111}
.fan-pack{border:var(--bd);box-shadow:var(--sh)}
.v2-sticker{position:absolute;z-index:4;right:6%;top:4%;background:var(--pink);color:#111;border:var(--bd);box-shadow:var(--sh-sm);border-radius:999px;font-family:var(--f-display);font-weight:900;font-size:15px;padding:6px 12px;transform:rotate(10deg)}

/* ---------- Étapes & panneaux ---------- */
.step-head .label{color:#111;background:var(--panel);border:var(--bd-thin);border-radius:999px;padding:4px 10px;box-shadow:2px 2px 0 #111}
.step-title{font-weight:900}
.step-head .hint{color:var(--muted)}
.panel{background:var(--panel);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.panel-players{background:var(--panel)}
.panel-game{background:#FFF9EC}
.panel h2{font-weight:900}
.label{color:var(--muted)}
.team-row input[type=text]{background:#fff;border:var(--bd-thin);border-radius:var(--r-sm);color:#111;font-weight:600}
.team-row input[type=text]:focus{box-shadow:var(--sh-sm);outline:none}
.sw,.sw.on{border:var(--bd-thin)!important;box-shadow:2px 2px 0 #111!important}
.seg button{border:var(--bd-thin);background:#fff;color:#111;font-weight:700;box-shadow:2px 2px 0 #111;transition:transform .08s,box-shadow .08s}
.seg button.on{background:#111;color:#fff;border-color:#111}
.seg button:active{transform:translate(2px,2px);box-shadow:none}
.hint{color:var(--muted)}
.err{color:#D12B2B}
.bottom-bar{background:var(--ink);border-top:var(--bd);box-shadow:0 40px 0 0 var(--ink)}
.sel{color:var(--muted)} .sel b{color:#111}

/* ---------- Boosters ---------- */
.search{background:#fff;border:var(--bd);border-radius:var(--r-sm);box-shadow:var(--sh-sm);color:#111}
.pack{border:var(--bd);box-shadow:var(--sh);border-radius:8px 8px 10px 10px}
.pack:hover{transform:translate(-2px,-4px)}
.pack-wrap.on .pack{box-shadow:0 0 0 3px var(--ink),0 0 0 6px #111,8px 8px 0 3px #111}
.pk-toggle{background:#fff;color:#111;border:var(--bd);box-shadow:2px 2px 0 #111}
.pack-wrap.on .pk-toggle{background:var(--imp);color:#111}
.plus-btn{background:var(--pla);color:#111;border:var(--bd);box-shadow:var(--sh-sm)}
.plus-btn[aria-expanded="true"]{background:#111;color:#fff;border-color:#111}
.report{background:#fff;border:var(--bd-thin);box-shadow:var(--sh-sm)}
.report ul{color:var(--muted)}
.format{border:var(--bd-thin)}
.format th{background:var(--raise)}
.format th,.format td{border-bottom:1.5px solid #111}

/* ---------- Menus ---------- */
.menu-pop{background:#fff;border:var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.menu-item{color:#111}
.menu-item:hover:not([disabled]){background:var(--raise)}
.menu-note{color:var(--dim)}
.burger{background:#fff;border:var(--bd);box-shadow:var(--sh-sm)}
.burger i{background:#111}
.burger[aria-expanded="true"]{background:#111}
.burger[aria-expanded="true"] i{background:#fff}

/* ---------- Partie : bandeau, tour ---------- */
.play-head{background:transparent}
@media (max-width:900px){.play-head{background:var(--ink)}}
.chip{background:#fff;border:var(--bd-thin);box-shadow:2px 2px 0 #111;color:#111}
.chip .nm{color:var(--muted)}
.chip .dot{border:1.5px solid #111}
.chip .prog{height:4px}
.chip.cur{background:var(--pla);border-color:#111}
.chip.cur .nm{color:#111}
.strip-info{color:var(--dim)}
.turn{color:var(--muted)}
.turn b{color:#111}
.pawn-s{border:2px solid #111!important}
.flash{color:var(--muted)} .flash b{color:#111}
.scoreboard{background:#fff;border:var(--bd);box-shadow:var(--sh);border-radius:var(--r)}
.srow.cur{border:var(--bd-thin);background:var(--raise)}
.srow .bar{background:#EDE3CF;border:1.5px solid #111;height:8px}
.round{color:var(--muted)}

/* ---------- Carte TCG ---------- */
.tcg{border:3px solid #111;box-shadow:var(--sh-lg);border-radius:18px}
.tcg-in{background:#FFFDF6;box-shadow:inset 0 0 0 2.5px #111}
.tcg-title,.tcg-type,.tcg-text{background:#fff;border:var(--bd-thin)}
.tcg-title{box-shadow:2px 2px 0 #111}
.cost{border:var(--bd-thin);box-shadow:2px 2px 0 #111}
.tcg-art{border:var(--bd-thin);box-shadow:none}
.gem{background:#fff;border:var(--bd-thin);box-shadow:2px 2px 0 #111;transition:transform .08s,box-shadow .08s,background .08s}
.gem:hover:not([disabled]){background:var(--pla);color:#111;transform:translate(-1px,-1px);box-shadow:3px 3px 0 #111}
.gem:active:not([disabled]){transform:translate(2px,2px);box-shadow:none}
.tcg-a{background:#111;color:#fff;border-radius:var(--r-sm)}
.tcg-a small{color:var(--pla)}
.timer{background:#EDE3CF;border:1.5px solid #111;height:12px}
.timer i{background:#111}
.timer-row.out{color:#D12B2B}
.timer-row.out .timer i{background:var(--ko)}
.tcg-foot{opacity:.8}

/* ---------- Écran de score ---------- */
.rc-delta{-webkit-text-stroke:3px #111;paint-order:stroke fill;text-shadow:5px 5px 0 #111}
.rc-delta.miss{color:#fff}
.rc-line{color:var(--muted)} .rc-line b{color:#111}
.rc-board{background:#fff;border:var(--bd);box-shadow:var(--sh);border-radius:var(--r)}
.rc-row{background:#FFF9EC;border:var(--bd-thin)}
.rc-row.me{box-shadow:3px 3px 0 #111;background:var(--raise)}
.rc-row .dot{border:1.5px solid #111}
.rc-pos{color:#111}
.rc-bar{background:#EDE3CF;border:1.5px solid #111;height:7px}
.rc-mv.up{color:#0E8F78} .rc-mv.down{color:#D12B2B}
.rc-next{box-shadow:var(--sh),0 -10px 24px 6px var(--ink)}

/* ---------- Unboxing ---------- */
.unbox{background:rgba(255,244,223,.94);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ub-rays{background:repeating-conic-gradient(from 0deg,rgba(17,17,17,.09) 0 5deg,transparent 5deg 16deg)}
.ub-hint{color:var(--muted)}
.ub-piece{border:var(--bd)}
.ub-pack{filter:drop-shadow(6px 6px 0 #111)}
.ub-back{background:repeating-linear-gradient(45deg,#fff 0 10px,#FFE9B8 10px 20px);border:var(--bd)}
.ub-front{border:var(--bd);box-shadow:var(--sh)}
.ub-info p{color:var(--muted)}
.spark{box-shadow:none;border:1.5px solid #111}

/* ---------- Victoire ---------- */
.win .label{color:#111;background:var(--pla);border:var(--bd-thin);padding:4px 10px;border-radius:999px;box-shadow:2px 2px 0 #111}
.win h1{font-weight:900}
.confetti span{border:var(--bd);box-shadow:var(--sh-sm)}
.ranking div{border-bottom:2px solid #111}

/* ---------- Dev ---------- */
.dev-btn{background:#fff;color:#111;border:var(--bd-thin);box-shadow:2px 2px 0 #111}
.dev-btn:hover,.dev-btn[aria-expanded="true"]{background:var(--pink);color:#111;border-color:#111}
.dev{background:#fff;border:var(--bd);box-shadow:var(--sh);color:#111}
.dev .row span{color:var(--muted)}
.dev select{background:#fff;border:var(--bd-thin);color:#111}
.dev .sep{background:#111}
.dev .toast{color:#0E8F78}

.glow{box-shadow:var(--sh)}
.pack.glow,.fan-pack.glow{box-shadow:var(--sh)}
@media (min-width:700px){.ub-cards{grid-template-columns:repeat(auto-fit,minmax(150px,180px))}}
@media (max-width:800px){.home h1{font-size:clamp(38px,11vw,62px)}}
.opened .ub-cards{display:flex;flex-wrap:wrap;justify-content:center}
.ub-card{width:150px;flex:none}
@media (min-width:700px){.ub-card{width:175px}}
.opened .ub-stage{padding-top:46px}

/* =====================================================================
   2.0 · Cartes, boosters et logo néo-brutalistes
   Les finitions deviennent des aplats découpés (bandes à bord net),
   le reflet est une bande blanche franche, l'illustration a une trame.
   ===================================================================== */
/* --- Reflet : bande franche, pas de flou --- */
.shine::after{background:linear-gradient(105deg,transparent 0 42%,rgba(255,255,255,.9) 42% 47%,transparent 47% 51%,rgba(255,255,255,.6) 51% 53%,transparent 53%);background-size:300% 100%;background-position:150% 0;mix-blend-mode:normal;animation:sheen2 4.5s steps(1,end) infinite,sheen 4.5s cubic-bezier(.6,0,.3,1) infinite}
@keyframes sheen2{0%,100%{opacity:1}}
/* --- Néon : ombre dure en couleur --- */
.glow{box-shadow:4px 4px 0 #FFE45C,7px 7px 0 #111}
.pack.glow{box-shadow:4px 4px 0 #FFE45C,7px 7px 0 #111}
.tcg.glow{box-shadow:5px 5px 0 #FFE45C,9px 9px 0 #111}

/* --- Logo --- */
.logo{font-family:var(--f-display);font-weight:900;letter-spacing:-.01em;gap:.18em}
.logo em{display:inline-block;background:var(--pla);color:#111;border:2.5px solid #111;border-radius:.3em;padding:.12em .3em .08em;margin-right:0;letter-spacing:0;transform:rotate(-5deg);box-shadow:2px 2px 0 #111}
.brand.logo{font-size:22px}
.home-logo{font-size:16px}
.pk-brand.logo,.tcg-foot .logo{--lf:#111;font-size:10px;letter-spacing:0}
.pk-brand.logo em,.tcg-foot .logo em{background:#111;color:#fff;border:1.5px solid #111;box-shadow:1.5px 1.5px 0 rgba(0,0,0,.35);transform:rotate(-4deg)}
.ub-back .logo{font-size:15px;flex-direction:column;gap:6px}
.ub-back .logo em{font-size:22px}

/* --- Boosters --- */
.pack,.fan-pack{border:3px solid #111;border-radius:10px;box-shadow:5px 5px 0 #111;padding:20px 10px 18px}
.crimp{height:11px;background:repeating-linear-gradient(90deg,#111 0 2.5px,transparent 2.5px 6px);border-bottom:2.5px solid #111;opacity:.9}
.crimp.bottom{border-top:2.5px solid #111;border-bottom:0}
.pk-brand{margin-top:8px}
.pk-mid{background:#fff;border:2.5px solid #111;border-radius:8px;box-shadow:3px 3px 0 #111;padding:10px 8px;width:calc(100% - 6px);gap:5px;transform:rotate(-1.5deg)}
.pk-name{font-family:var(--f-display);font-weight:900;color:#111;letter-spacing:-.02em}
.pk-desc{opacity:.7;font-weight:500;color:#111}
.pk-foot{background:#111;color:#fff;border-radius:999px;padding:4px 9px;opacity:1;font-size:9.5px;letter-spacing:.1em}
.fan-pack .pk-name{background:#fff;border:2px solid #111;border-radius:6px;box-shadow:2px 2px 0 #111;padding:6px 6px;transform:rotate(-2deg)}
.pack-wrap.on .pack{box-shadow:0 0 0 3px var(--ink),0 0 0 6px #111,9px 9px 0 3px #111}
.pack:hover{transform:translate(-2px,-3px) rotate(-1deg)}

/* --- Carte de jeu --- */
.tcg{border:3px solid #111;border-radius:20px;padding:11px;box-shadow:7px 7px 0 #111}
.tcg-in{background:#FFF8EA;border:2.5px solid #111;box-shadow:none;border-radius:12px;gap:8px}
.tcg-title{background:#fff;border:2.5px solid #111;border-radius:10px;box-shadow:3px 3px 0 #111}
.tcg-title h2{font-family:var(--f-display);font-weight:900;letter-spacing:-.02em}
.tcg-title h2.set{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;font-size:12px}
.cost{border:2.5px solid #111;box-shadow:2px 2px 0 #111;font-family:var(--f-display);font-weight:900}
.tcg-art{border:2.5px solid #111;border-radius:10px}
.tcg-art::before{content:"";position:absolute;inset:0;z-index:0;background-image:radial-gradient(rgba(17,17,17,.16) 1.3px,transparent 1.5px);background-size:9px 9px;pointer-events:none}
.art-kicker{display:inline-block;align-self:center;background:#fff;border:2px solid #111;border-radius:999px;padding:3px 10px;box-shadow:2px 2px 0 #111;font-size:12px;font-weight:700}
.tcg-art.is-q .art-kicker{align-self:flex-start;font-size:10px;opacity:1}
.art-theme{font-family:var(--f-display);font-weight:900;letter-spacing:-.035em;color:#111;-webkit-text-stroke:0}
.art-sub{background:#111;color:#fff;border-radius:999px;padding:4px 10px;opacity:1;font-size:10px}
.art-q{font-family:var(--f-display);font-weight:900;letter-spacing:-.02em;background:#fff;border:2.5px solid #111;border-radius:10px;box-shadow:3px 3px 0 #111;padding:12px 14px}
.tcg-type{background:#111;color:#fff;border:2.5px solid #111;border-radius:8px}
.tcg-text{background:#fff;border:2.5px solid #111;border-radius:10px}
.gem{border-radius:10px;aspect-ratio:1.25;font-family:var(--f-display);font-weight:900;border:2.5px solid #111;box-shadow:2px 2px 0 #111}
.tcg-foot{opacity:1;font-weight:800}

/* --- Unboxing --- */
.ub-piece{border:3px solid #111}
.ub-body{padding:30% 12px 22px}
.ub-pack .pk-name{background:#fff;border:2.5px solid #111;border-radius:8px;box-shadow:3px 3px 0 #111;padding:10px 12px;transform:rotate(-2deg)}
.ub-front{border:3px solid #111;box-shadow:5px 5px 0 #111;justify-content:space-between}
.ub-front .meta{background:#111;color:#fff;border-radius:999px;padding:3px 8px;opacity:1}
.ub-front b{font-family:var(--f-display);font-weight:900;background:#fff;border:2.5px solid #111;border-radius:8px;box-shadow:3px 3px 0 #111;padding:10px 8px;width:100%;transform:rotate(-2deg)}
.ub-back{border:3px solid #111;background:repeating-linear-gradient(45deg,var(--pla) 0 12px,#fff 12px 24px)}
.ub-front .holo{background:linear-gradient(110deg,transparent 0 44%,rgba(255,255,255,.95) 44% 52%,transparent 52%);background-size:100% 100%;mix-blend-mode:normal;transform:translateX(-130%);animation-name:holo2}
@keyframes holo2{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
.pk-name{overflow-wrap:normal;word-break:normal;hyphens:manual}
.pack .pk-name{font-size:clamp(14px,3.9vw,19px)}
/* finitions sombres et tramées */
.dark .crimp{--crc:#fff;background:repeating-linear-gradient(90deg,#fff 0 2.5px,transparent 2.5px 6px);border-color:#fff}
.pack.dark .pk-brand.logo,.fan-pack.dark .pk-brand.logo,.ub-body.dark .pk-brand.logo{--lf:#fff}
.dark .pk-brand.logo em{background:#FF4FB0;color:#111;border-color:#111}
.tcg-art.dark .art-theme,.tcg-art.dark .art-kicker{color:#111}
.tcg-art.dark .art-theme{color:#fff;text-shadow:3px 3px 0 #111}
.pack.halftone::before,.fan-pack.halftone::before,.tcg-art.halftone::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(17,17,17,.18) 1.4px,transparent 1.6px);background-size:8px 8px}
.cost.dark{color:#fff;text-shadow:1.5px 1.5px 0 #111}
/* boosters : ouvrir au tap, ajouter avec un vrai bouton */
.pack-wrap{display:flex;flex-direction:column;gap:12px}
.pk-open{position:absolute!important;z-index:4!important;left:50%;bottom:22px;transform:translateX(-50%) rotate(-3deg);background:var(--pla);color:#111;border:2px solid #111;border-radius:999px;box-shadow:2px 2px 0 #111;font-family:var(--f-display);font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;opacity:0;transition:opacity .15s}
.pack:hover .pk-open,.pack:focus-visible .pk-open{opacity:1}
@media (hover:none){.pk-open{opacity:1}.pack .pk-foot{visibility:hidden}}
.pk-add{width:100%;border:2.5px solid #111;background:#fff;color:#111;border-radius:10px;box-shadow:3px 3px 0 #111;padding:9px 8px;font-family:var(--f-display);font-weight:800;font-size:14px;transition:transform .08s,box-shadow .08s,background .1s}
.pk-add:active{transform:translate(3px,3px);box-shadow:none}
.pk-add.on{background:var(--imp)}
.pack-wrap.on .pack{box-shadow:0 0 0 3px var(--ink),0 0 0 6px #111,9px 9px 0 3px #111}
.pk-toggle{display:none}
.pk-open{display:none}
@media (hover:none){.pack .pk-foot{visibility:visible}}
.pk-check{position:absolute!important;z-index:5!important;bottom:18px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--imp);border:2.5px solid #111;box-shadow:2px 2px 0 #111;display:grid;place-items:center;font-weight:900;font-size:15px;color:#111;transform:scale(0);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.pack-wrap.on .pk-check{transform:scale(1)}
.pk-add{font-family:var(--f-body);font-weight:700;font-size:13px;background:#fff}
</style>
</head>
<body>

<div id="app" class="app"></div>
<div id="unbox" class="unbox" hidden></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv,.ods" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ================= Finitions des decks ================= */
const FINISHES = {
  irise:{label:'Irisé', bg:'linear-gradient(118deg,#FFB0DC 0 19%,#9FE3FF 19% 38%,#C9FFA8 38% 57%,#FFEE8F 57% 76%,#CDB4FF 76% 100%)', fx:'shine'},
  metal:{label:'Métal', bg:'linear-gradient(118deg,#C3C9D2 0 36%,#F5F7FA 36% 44%,#C3C9D2 44% 52%,#E6E9EE 52% 56%,#A7AFBB 56% 100%)', fx:'shine'},
  or:{label:'Or', bg:'linear-gradient(118deg,#F5BE2A 0 36%,#FFF3B0 36% 44%,#F5BE2A 44% 52%,#FFDF73 52% 56%,#DB9F12 56% 100%)', fx:'shine'},
  cuivre:{label:'Cuivre', bg:'linear-gradient(118deg,#E8854E 0 36%,#FFD3B3 36% 44%,#E8854E 44% 52%,#F8B08A 52% 56%,#C2602D 56% 100%)', fx:'shine'},
  nacre:{label:'Nacre', bg:'linear-gradient(118deg,#FFF9EF 0 28%,#F1DEFF 28% 50%,#D8F6F0 50% 72%,#FFEBD6 72% 100%)', fx:'shine'},

/* ================= Import Excel ================= */
function parseSheet(rows, sheetName, out, defDeck){
  let hi=-1;
  for(let r=0;r<Math.min(rows.length,10);r++){
    const h=(rows[r]||[]).map(norm);
    if(h.some(x=>x.startsWith('theme')) && h.some(x=>x.startsWith('question')||/^q\s*\d+$/.test(x))){hi=r;break}
    if(h.some(x=>x.startsWith('deck')) && h.some(x=>x.startsWith('finition')||x.startsWith('couleur'))){
      const di=h.findIndex(x=>x.startsWith('deck')), fi=h.findIndex(x=>x.startsWith('finition')||x.startsWith('couleur')), si=h.findIndex(x=>x.startsWith('desc'));
      for(let k=r+1;k<rows.length;k++){
        const row=rows[k]||[]; const name=String(row[di]??'').trim(); if(!name) continue;
        const f=finishFrom(row[fi]);
        if(String(row[fi]??'').trim()&&!f) out.warnings.push(`${sheetName}, ligne ${k+1} : finition « ${row[fi]} » inconnue, une finition sera choisie au hasard.`);
        out.decks[name]={...(f?{finish:f}:{}),...(si>=0&&String(row[si]??'').trim()?{desc:String(row[si]).trim()}:{})};
      }
      return;
    }
  }
  if(hi<0) return;
  const H=(rows[hi]).map(norm);
  const col=f=>H.findIndex(f);
  let di=col(x=>x.startsWith('deck')||x.startsWith('paquet'));
  if(di<0) di=col(x=>x.startsWith('cat'));
  const ti=col(x=>x.startsWith('theme')), ni=col(x=>x.startsWith('niv')||x.startsWith('level'));
  const map={};
  const get=(deck,name)=>{const k=deck+'|'+norm(name);return map[k]||(map[k]={deck,name:String(name).trim(),qs:Array(10).fill(null)})};
  let lastDeck=null,lastTheme=null;
  if(ni>=0){
    const qi=col(x=>x.startsWith('question')), ri=col(x=>x.startsWith('rep')||x.startsWith('answer'));
    for(let r=hi+1;r<rows.length;r++){
      const row=rows[r]||[]; const line=r+1;
      if(!row.some(v=>String(v??'').trim())) continue;
      const themeName=String(row[ti]??'').trim()||lastTheme;
      const cell=di>=0?String(row[di]??'').trim():'';
      const deck=cell||(themeName===lastTheme&&lastDeck)||lastDeck||defDeck;
      const lv=parseInt(row[ni],10), q=String(row[qi]??'').trim(), a=String(row[ri]??'').trim();
      if(!q&&!a) continue;
      if(!themeName){out.warnings.push(`${sheetName}, ligne ${line} : thème manquant, ligne ignorée.`);continue}
      lastTheme=themeName;lastDeck=deck;
      if(!(lv>=1&&lv<=10)){out.warnings.push(`${sheetName}, ligne ${line} : niveau « ${row[ni]??''} » invalide (1 à 10).`);continue}
      if(!q||!a){out.warnings.push(`${sheetName}, ligne ${line} : question ou réponse vide.`);continue}
      get(deck,themeName).qs[lv-1]={q,a};
    }
  } else {
    const qc={},rc={};
    H.forEach((h,i)=>{let m=h.match(/^(?:q|question)\s*(\d+)$/);if(m)qc[+m[1]]=i;m=h.match(/^(?:r|rep|reponse|answer)\s*(\d+)$/);if(m)rc[+m[1]]=i});
    for(let r=hi+1;r<rows.length;r++){
      const row=rows[r]||[];
      const themeName=String(row[ti]??'').trim(); if(!themeName) continue;
      const deck=(di>=0&&String(row[di]??'').trim())||defDeck;
      const t=get(deck,themeName);
      for(let l=1;l<=10;l++){const q=String(row[qc[l]]??'').trim(),a=String(row[rc[l]]??'').trim();if(q&&a)t.qs[l-1]={q,a}}
    }
  }
  Object.values(map).forEach(t=>{
    const n=t.qs.filter(Boolean).length;
    if(!n) return;
    if(n<10) out.warnings.push(`« ${t.name} » : ${n}/10 niveaux remplis, les autres seront grisés.`);
    out.themes.push(t);
  });
}
function parseWorkbook(buf, defDeck){
  const out={themes:[],decks:{},warnings:[]};
  const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
  wb.SheetNames.forEach(n=>parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}),n,out,defDeck));
  return out;
}

function importFile(file){
  if(!window.XLSX){S.report={file:file.name,added:0,warnings:['La lecture Excel n’a pas pu se charger. Vérifiez la connexion puis réessayez.']};render();return}
  const fr=new FileReader();
  fr.onload=()=>{
    let out={themes:[],decks:{},warnings:[]};
    const base=file.name.replace(/\.[^.]+$/,'');
    try{ out=parseWorkbook(fr.result,base); }
    catch(e){out.warnings.push('Fichier illisible : enregistrez-le en .xlsx et réessayez.')}
    let added=0,replaced=0;
    out.themes.forEach(t=>{
      const i=IMPORTS.findIndex(x=>x.deck===t.deck&&norm(x.name)===norm(t.name));
      const obj={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),src:file.name,...t};
      if(i>=0){IMPORTS[i]=obj;replaced++}else{IMPORTS.push(obj);added++}
    });
    Object.assign(IMPORT_DECKS,out.decks);
    const decks=[...new Set(out.themes.map(t=>t.deck))];
    decks.forEach(d=>S.on[d]=true);
    if(!out.themes.length&&!out.warnings.length) out.warnings.push('Aucune carte trouvée. La première ligne doit contenir les colonnes Deck, Thème, Niveau, Question, Réponse.');
    saveImports();
    S.report={file:file.name,added,replaced,decks,warnings:out.warnings};
    render();
  };
  fr.readAsArrayBuffer(file);
}

/* ================= Logique de jeu ================= */
function draw(deck, exclude){
  const L=lib();
  let pool=L.filter(t=>t.deck===deck&&!S.used.includes(t.id)&&t.id!==exclude);
  if(!pool.length){S.used=S.used.filter(id=>L.find(t=>t.id===id)?.deck!==deck);pool=L.filter(t=>t.deck===deck&&t.id!==exclude)}
  if(!pool.length) pool=L.filter(t=>t.deck===deck);
  if(!pool.length) pool=L.filter(t=>!S.used.includes(t.id)&&t.id!==exclude);
  if(!pool.length) pool=L;
  const t=rnd(pool); S.used.push(t.id); return t;
}
function beginTurn(){
  stopTimer();
  S.level=null;
  const decks=activeDecks();
  S.theme=draw(decks[S.deckTurn%decks.length]);
  S.phase='pick';
}
function choose(l){
  if(S.phase!=='pick') return;
  if(!S.theme.qs[l-1]) return;
  S.level=l; S.phase='question'; startTimer(); render();
}
function reveal(){ if(S.phase!=='question') return; S.phase='answer'; stopTimer(); render(); }
function totalTurns(){ return S.rounds*S.teams.length }
function finish(){ stopTimer(); S.live=false; S.screen='win'; render(); }
function ranking(scores){ return scores.map((sc,i)=>({i,sc})).sort((x,y)=>y.sc-x.sc||x.i-y.i).map(r=>r.i); }
function resolve(ok){
  if(S.phase!=='answer') return;
  stopTimer();
  const before=S.teams.map(t=>t.score);
  S.history.push({scores:before,cur:S.cur,turn:S.turn,deckTurn:S.deckTurn,used:[...S.used]});
  const t=team();
  if(ok) t.score+=S.level;
  const won=S.mode==='points'&&t.score>=S.goal;
  const last=S.mode==='rounds'&&S.turn+1>=totalTurns();
  S.recap={who:S.cur, ok, level:S.level, before, final:won||last};
  S.flash=''; S.phase='recap'; S.menuOpen=false;
  render();
}
function nextTurn(){
  if(S.phase!=='recap') return;
  if(S.recap.final){ S.recap=null; return finish(); }
  S.recap=null;
  S.turn++; S.deckTurn++;
  S.cur=(S.cur+1)%S.teams.length;
  beginTurn(); render();
}
function undo(){
  const h=S.history.pop(); if(!h) return;
  S.recap=null;
  S.teams.forEach((t,i)=>t.score=h.scores[i]); S.cur=h.cur; S.turn=h.turn; S.deckTurn=h.deckTurn; S.used=h.used;
  S.screen='game'; S.live=true; S.menuOpen=false; S.flash='Dernier coup annulé.'; beginTurn(); render();
}
function startGame(){
  S.error='';
  S.teams.forEach((t,i)=>{if(!t.name.trim())t.name=W().def+' '+(i+1)});
  if(S.teams.length<2){S.error=S.play==='solo'?'Il faut au moins deux joueurs.':'Il faut au moins deux équipes.';render();return}
  if(!activeDecks().length){S.error='Ajoute au moins un deck à la partie.';S.screen='decks';render();return}
  S.teams.forEach(t=>t.score=0);
  S.cur=0;S.turn=0;S.deckTurn=Math.floor(Math.random()*activeDecks().length);S.used=[];S.history=[];S.flash='';
  S.live=true; S.recap=null; S.lastDealt=null;
  S.screen='game'; beginTurn(); render();
}
function resumeGame(){
  S.error='';
  if(!activeDecks().length){S.error='Ajoute au moins un deck à la partie.';render();return}
  S.cur=S.cur%S.teams.length;
  S.teams.forEach(t=>{if(typeof t.score!=='number')t.score=0});
  S.screen='game'; S.menuOpen=false;
  if(S.phase!=='recap'&&!(S.theme&&S.on[S.theme.deck])) beginTurn();
  else if(S.phase==='question') startTimer();
  render();
}

/* ================= Chrono ================= */
function startTimer(){ stopTimer(); if(!S.timer) return; deadline=Date.now()+S.timer*1000; tick=setInterval(updTimer,200); }
function stopTimer(){ if(tick){clearInterval(tick);tick=null} }
function updTimer(){
  const left=Math.max(0,deadline-Date.now()), bar=document.getElementById('tbar'), num=document.getElementById('tnum'), row=document.getElementById('trow');
  if(!bar) return;
  bar.style.width=(left/(S.timer*1000)*100)+'%';
  num.textContent=left>0?Math.ceil(left/1000)+' s':'Temps écoulé';
  row.classList.toggle('out',left===0);
  if(left===0) stopTimer();
}

/* ================= Rendu ================= */
function render(){
  const v={home:viewHome,setup:viewPlayers,decks:viewDeckPicker,game:viewGame,win:viewWin}[S.screen]||viewHome;
  $app.innerHTML=v();
  if(S.screen==='game'&&S.theme) S.lastDealt=S.theme.id;
  if(S.screen==='game'&&S.phase==='question') updTimer();
  if(S.screen==='game'&&S.phase==='recap'){ focusRecap(); if(!S.recap.anim){ S.recap.anim=true; animateRecap(); } }
  if(S.screen==='decks') applySearch();

/* ================= Unboxing ================= */
let SEEN=(()=>{try{return JSON.parse(localStorage.getItem('connoisseur.seen')||'{}')}catch(e){return {}}})();
const UB={timers:[],tearing:false,drag:null};
function ubLater(fn,ms){UB.timers.push(setTimeout(fn,ms))}
function tearLine(){
  // ligne de déchirure en dents de scie, en % de la hauteur du paquet
  const pts=[]; const base=19;
  const N=18;
  for(let i=0;i<=N;i++){ const x=i===N?100:+(i*100/N).toFixed(2); pts.push([x, +(base+(Math.random()*4.4-2.2)).toFixed(2)]); }
  return pts;
}
function openPack(name){
  const d=deckMeta(name); const f=finishOf(d.finish);
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const box=document.getElementById('unbox');
  UB.timers.forEach(clearTimeout); UB.timers=[]; UB.tearing=false; UB.drag=null;
  const L=tearLine();
  const topClip='polygon(0 0,100% 0,'+[...L].reverse().map(([x,y])=>`${x}% ${y}%`).join(',')+')';
  const bodyClip='polygon('+L.map(([x,y])=>`${x}% ${y}%`).join(',')+',100% 100%,0 100%)';
  const poly=L.map(([x,y])=>`${x},${y}`).join(' ');
  const sparks=Array.from({length:22},(_,i)=>{const a=-160+Math.random()*140, dist=90+Math.random()*170, s=4+Math.random()*7;return `<i class="spark" style="--a:${a}deg;--d:${dist}px;--s:${s}px;--t:${(Math.random()*.25).toFixed(2)}s"></i>`}).join('');
  const cards=d.themes.map((t,i)=>`<div class="ub-card" style="--i:${i};--r:${(Math.random()*24-12).toFixed(1)}deg">
      <div class="ub-inner">
        <div class="ub-back"><span class="logo"><em>CON</em>NOISSEUR</span></div>
        <div class="ub-front ${f.fx}" style="background:${f.bg}"><span class="meta">◆ ${i+1}/${d.themes.length}</span><b>${esc(t.name)}</b><span class="meta">${t.qs.filter(Boolean).length} questions</span><i class="holo"></i></div>
      </div></div>`).join('');
  box.innerHTML=`<div class="ub-dialog" role="dialog" aria-modal="true" aria-label="Booster ${esc(d.name)}">
    <button class="icon-btn ub-close" data-u="close" aria-label="Fermer">✕</button>
    <div class="ub-stage">
      <div class="ub-rays" aria-hidden="true"></div>
      <div class="ub-burst" aria-hidden="true">${sparks}</div>
      <div class="ub-pack" data-u="tear" role="button" tabindex="0" aria-label="Déchirer le booster">
        <div class="ub-piece ub-body ${f.fx}" style="background:${f.bg};clip-path:${bodyClip}">
          <span class="pk-brand logo"><em>CON</em>NOISSEUR</span>
          <span class="pk-name">${esc(d.name)}</span>
          <span class="pk-foot">${plural(d.themes.length,'carte')}</span>
          <span class="crimp bottom"></span>
          <span class="ub-glow"></span>
        </div>
        <div class="ub-piece ub-top ${f.fx}" style="background:${f.bg};clip-path:${topClip}"><span class="crimp"></span><span class="ub-notch">◀ déchirer ici</span></div>
        <svg class="ub-line" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline class="guide" points="${poly}"/></svg>
        <svg class="ub-cut" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${poly}"/></svg>
      </div>
      <p class="ub-hint">Glisse le long du haut pour déchirer, ou clique</p>
      <div class="ub-cards">${cards}</div>
    </div>
    <div class="ub-info">
      <h3>${esc(d.name)}</h3>
      ${d.desc?`<p>${esc(d.desc)}</p>`:''}
      <div class="actions"><button class="btn ${S.on[name]?'':'primary'}" data-u="toggle">${S.on[name]?'Retirer de la partie':'Ajouter à la partie'}</button><button class="btn ghost" data-u="close">Fermer</button></div>
    </div>
  </div>`;
  box.hidden=false; box.dataset.deck=name; box.style.setProperty('--n',d.themes.length);
  box.className='unbox'+(reduce||(SEEN[name]&&!DEV.always)?' opened done quick':'');
  requestAnimationFrame(()=>box.classList.add('in'));
  const pack=box.querySelector('.ub-pack');
  pack.focus();
  // déchirure au doigt ou à la souris
  pack.addEventListener('pointerdown',e=>{ if(UB.tearing) return; const r=pack.getBoundingClientRect(); UB.drag={x0:e.clientX,r,moved:false}; pack.setPointerCapture(e.pointerId); });
  pack.addEventListener('pointermove',e=>{
    if(!UB.drag||UB.tearing) return;
    const p=Math.max(0,Math.min(1,(e.clientX-UB.drag.r.left)/UB.drag.r.width));
    if(Math.abs(e.clientX-UB.drag.x0)>8) UB.drag.moved=true;
    if(UB.drag.moved){ box.style.setProperty('--p',p.toFixed(3)); box.classList.add('dragging'); if(p>.85) tearPack(true); }
  });
  pack.addEventListener('pointerup',()=>{ if(!UB.drag) return; const moved=UB.drag.moved; UB.drag=null; box.classList.remove('dragging'); if(!moved) tearPack(false); else if(!UB.tearing) box.style.setProperty('--p',0); });
  pack.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();tearPack(false)} });
}
function tearPack(fromDrag){
  const box=document.getElementById('unbox');
  if(UB.tearing||box.classList.contains('opened')) return;
  UB.tearing=true; UB.drag=null; box.classList.remove('dragging');
  const k=1/DEV.speed; const lineMs=Math.round((fromDrag?120:DEV.tear)*k);
  box.classList.add('tearing'); box.style.setProperty('--lineMs',lineMs+'ms'); box.style.setProperty('--p',1);
  ubLater(()=>box.classList.add('torn'),lineMs);
  ubLater(()=>box.classList.add('burst'),lineMs+260*k);
  ubLater(()=>box.classList.add('opened'),lineMs+900*k);
  const n=+box.style.getPropertyValue('--n')||1;
  ubLater(()=>box.classList.add('done'),lineMs+(900+n*DEV.stagger+900)*k);
  SEEN[box.dataset.deck]=1; try{localStorage.setItem('connoisseur.seen',JSON.stringify(SEEN))}catch(e){}
}
function closePack(){ UB.timers.forEach(clearTimeout); UB.timers=[]; const box=document.getElementById('unbox'); box.hidden=true; box.innerHTML=''; box.className='unbox'; box.removeAttribute('style'); }
document.getElementById('unbox').addEventListener('click',e=>{
  const box=e.currentTarget;
  if(e.target===box) return closePack();
  const b=e.target.closest('[data-u]'); if(!b||b.dataset.u==='tear') return;
  const u=b.dataset.u, name=box.dataset.deck;
  if(u==='close') closePack();
  else if(u==='toggle'){ if(S.on[name])delete S.on[name]; else S.on[name]=true; S.error=''; closePack(); render(); }
});

function viewScores(){
  const max=S.mode==='points'?S.goal:Math.max(1,...S.teams.map(t=>t.score));
  const rows=S.teams.map((t,i)=>`<div class="srow ${i===S.cur?'cur':''}">

    <span class="bar"><i style="width:${Math.min(100,t.score/max*100)}%;background:${t.color}"></i></span>
  </div>`).join('');
  return `<div class="scoreboard"><span class="round">${roundInfo()}</span>${rows}</div>`;
}
function roundInfo(){ return S.mode==='points'?`Premier à ${S.goal} points`:`Tour ${Math.min(S.rounds,Math.floor(S.turn/S.teams.length)+1)} / ${S.rounds}`; }
function viewStrip(){
  const max=S.mode==='points'?S.goal:Math.max(1,...S.teams.map(t=>t.score));
