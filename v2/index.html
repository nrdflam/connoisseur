    </div>`).join('')}<span class="strip-info">${S.mode==='points'?'/ '+S.goal:roundInfo()}</span></div>`;
}
function viewRecap(){
  const R=S.recap, who=S.teams[R.who], done=!!R.anim;
  const after=S.teams.map(t=>t.score);
  const oldRank=ranking(R.before), newRank=ranking(after);
  const max=S.mode==='points'?S.goal:Math.max(1,...after);
  const next=S.teams[(S.cur+1)%S.teams.length];
  const head=R.ok
    ? `<span class="rc-delta" style="--c:${who.color}">+${R.level}</span><p class="rc-line"><b>${esc(who.name)}</b> marque ${R.level} point${R.level>1?'s':''}.</p>`
    : (R.level>=7
      ? `<span class="rc-delta con">CON.</span><p class="rc-line"><b>${esc(who.name)}</b> visait ${R.level} et repart avec zéro.</p>`
      : `<span class="rc-delta miss">0</span><p class="rc-line"><b>${esc(who.name)}</b> ne marque rien.</p>`);
  const rows=newRank.map((i,pos)=>{
    const t=S.teams[i], from=oldRank.indexOf(i), mv=from-pos;
    return `<div class="rc-row ${i===R.who?'me':''} ${done?'moved':''}" data-from="${from}" data-to="${pos}" style="--c:${t.color}">
      <span class="rc-pos">${pos+1}</span><span class="dot"></span>
      <span class="nm">${esc(t.name)}</span>
      ${mv?`<span class="rc-mv ${mv>0?'up':'down'}">${mv>0?'▲':'▼'} ${Math.abs(mv)}</span>`:'<span class="rc-mv"></span>'}
      <b class="rc-pts" data-from="${R.before[i]}" data-to="${t.score}">${done?t.score:R.before[i]}</b>
      <span class="rc-bar"><i data-w="${Math.min(100,t.score/max*100)}" style="width:${Math.min(100,(done?t.score:R.before[i])/max*100)}%"></i></span>
    </div>`;
  }).join('');
  const btn=R.final?'Voir le classement final →':`Au tour de ${esc(next.name)} →`;
  return `<section class="recap">
    <div class="rc-head ${done?'still':''}">${head}</div>
    <div class="rc-board"><span class="round">${roundInfo()}</span><div class="rc-list" id="rc-list">${rows}</div></div>
    <button class="btn primary big rc-next" data-a="next">${btn}</button>
  </section>`;
}
function recapFade(){
  const l=document.getElementById('rc-list'); if(!l) return;
  const over=l.scrollHeight>l.clientHeight+2;
  l.classList.toggle('ft',over&&l.scrollTop>4);
  l.classList.toggle('fb',over&&l.scrollTop+l.clientHeight<l.scrollHeight-4);
}
function focusRecap(){
  const l=document.getElementById('rc-list'), me=l&&l.querySelector('.rc-row.me'); if(!l) return;
  if(me) l.scrollTop=Math.max(0,me.offsetTop-l.clientHeight/2+me.offsetHeight/2);
  recapFade();
  l.addEventListener('scroll',recapFade,{passive:true});
}
function animateRecap(){
  const rows=[...document.querySelectorAll('.rc-row')]; if(!rows.length) return;
  const h=rows[0].getBoundingClientRect().height+8;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  rows.forEach(r=>{ const d=(+r.dataset.from - +r.dataset.to)*h; r.style.transform=`translateY(${d}px)`; });
  const k=(typeof DEV!=='undefined')?1/DEV.speed:1;
  setTimeout(()=>{
    rows.forEach(r=>{ r.style.transition=reduce?'none':`transform ${700*k}ms cubic-bezier(.3,.8,.3,1)`; r.style.transform=''; r.classList.add('moved');
      const bar=r.querySelector('.rc-bar i'); bar.style.transition=reduce?'none':`width ${900*k}ms cubic-bezier(.3,.8,.3,1)`; bar.style.width=bar.dataset.w+'%'; });
    document.querySelectorAll('.rc-pts').forEach(el=>{
      const a=+el.dataset.from, b=+el.dataset.to; if(a===b||reduce){el.textContent=b;return}
      const t0=performance.now(), dur=900*k;
      const step=now=>{const p=Math.min(1,(now-t0)/dur);el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);else el.classList.add('pop')};
      requestAnimationFrame(step);
    });
  },450*k);
}
function viewCard(){
  const th=S.theme, d=deckMeta(th.deck), f=finishOf(d.finish);
  const idx=Math.max(1,d.themes.findIndex(t=>t.id===th.id)+1);
  const pick=S.phase==='pick', qa=pick?null:th.qs[S.level-1];
  let art, text;
  if(pick){
    art=`<span class="art-kicker">T’es con ou connoisseur en…</span><b class="art-theme">${esc(th.name)}</b><span class="art-sub">Note-toi de 1 à 10</span>`;
    text=`<div class="tcg-levels">${Array.from({length:10},(_,i)=>`<button class="gem" data-a="lv" data-l="${i+1}" ${th.qs[i]?'':'disabled'}>${i+1}</button>`).join('')}</div>`;
  } else {
    const len=qa.q.length;
    art=`<span class="art-kicker">Question niveau ${S.level}</span><p class="art-q ${len>110?'xl':len>70?'long':''}">${esc(qa.q)}</p>`;
    if(S.phase==='question'){
      const timer=S.timer?`<div class="timer-row" id="trow"><div class="timer"><i id="tbar" style="width:100%"></i></div><span id="tnum">${S.timer} s</span></div>`:'';
      text=`${timer}<button class="btn dark wide" data-a="reveal">Voir la réponse <span class="kbd">Espace</span></button>`;
    } else {
      text=`<div class="tcg-a"><small>Réponse</small>${esc(qa.a)}</div>
        <div class="tcg-verdict"><button class="btn ok" data-a="ok">Juste · +${S.level} <span class="kbd">J</span></button><button class="btn ko" data-a="ko">Faux <span class="kbd">F</span></button></div>`;
    }
  }
  const fresh=pick&&S.lastDealt!==th.id;
  return `<article class="tcg ${f.fx} ${fresh?'deal':''}" style="background:${f.bg}">
    <div class="tcg-in">
      <header class="tcg-title">${pick?`<h2 class="set">${esc(th.deck)}</h2>`:`<h2>${esc(th.name)}</h2>`}<span class="cost ${f.fx.includes('dark')?'dark':''}" style="background:${f.bg}">${pick?'?':S.level}</span></header>
      <div class="tcg-art ${f.fx} ${pick?'':'is-q'}" style="background:${f.bg}">${art}</div>
      <div class="tcg-type"><span>${pick?'Carte · 10 questions':'Carte · '+esc(th.deck)}</span><span>◆ ${idx}/${d.themes.length}</span></div>
      <div class="tcg-text">${text}</div>
      <footer class="tcg-foot"><span class="logo"><em>CON</em>NOISSEUR</span><span>${pick?'Choisis ta note':'Niv. '+S.level+' · '+S.level+' pt'+(S.level>1?'s':'')}</span></footer>
    </div>
  </article>`;
}
function viewGame(){
  const t=team();
  const item=(a,label,dis,extra='')=>`<button class="menu-item" data-a="${a}" ${extra} ${dis?'disabled':''}>${label}</button>`;
  return `
  <div class="topbar game-top"><span class="brand logo"><em>CON</em>NOISSEUR</span></div>
  <div class="game">
    <div class="side">${viewScores()}</div>
    <div class="side play">
      <div class="play-head">
      <div class="head-row">
        ${viewStrip()}
        <div class="burger-wrap">
          <button class="burger" data-a="burger" aria-expanded="${!!S.menuOpen}" aria-label="Options de la partie"><i></i><i></i><i></i></button>
          ${S.menuOpen?`<div class="menu-pop" role="menu">
            ${S.phase==='pick'?item('skip','Changer de carte'):''}
            ${item('undo','Annuler le dernier coup',!S.history.length)}
            ${item('go','Changer de decks',false,'data-v="decks"')}
            ${item('menu','Retour à l’accueil')}
            <p class="menu-note">Clavier : 1 à 9, 0 pour 10 · Espace révèle · J juste · F faux</p>
          </div>`:''}
        </div>
      </div>
      <div class="turn">
        <span class="pawn-s" style="background:${t.color}"></span><span class="who">${S.phase==='recap'?'Résultat pour':'Au tour de'} <b>${esc(t.name)}</b></span>
      </div>
      <div class="flash">${S.flash}</div>
      </div>
      <div class="play-body">${S.phase==='recap'?viewRecap():viewCard()}</div>
    </div>
  </div>`;
}
function viewWin(){
  const ranked=[...S.teams].sort((a,b)=>b.score-a.score);
  const top=ranked.filter(t=>t.score===ranked[0].score);
  const title=top.length>1?'Égalité':esc(top[0].name);
  const sub=top.length>1?`${top.map(t=>esc(t.name)).join(' et ')} terminent avec ${top[0].score} points.`:`${top[0].score} points.`;
  return `<section class="win">
    <div class="confetti">${['irise','or','neon','metal'].map(k=>`<span class="${FINISHES[k].fx}" style="background:${FINISHES[k].bg}"></span>`).join('')}</div>
    <span class="label">${top.length>1?'Fin de partie':'Victoire'}</span>
    <h1>${title}</h1>
    <p class="hint">${sub}</p>
    <div class="ranking">${ranked.map((t,i)=>`<div><span>${i+1}. ${esc(t.name)}</span><b>${t.score} pts</b></div>`).join('')}</div>
    <div class="actions"><button class="btn primary" data-a="replay">Rejouer avec ${S.play==='solo'?'les mêmes joueurs':'les mêmes équipes'}</button><button class="btn" data-a="undo" ${S.history.length?'':'disabled'}>Annuler le dernier coup</button><button class="btn" data-a="go" data-v="decks">Changer de decks</button><button class="btn ghost" data-a="menu">Retour au menu</button></div>
  </section>`;
}

/* ================= Événements ================= */
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!b&&(S.menuOpen||S.importOpen)&&!e.target.closest('.menu-pop')){S.menuOpen=false;S.importOpen=false;render();return}
  if(!b||b.disabled) return;
  const a=b.dataset.a;
  if(a==='burger'){S.menuOpen=!S.menuOpen;render();return}
  if(a==='import-menu'){S.importOpen=!S.importOpen;render();return}
  if(S.importOpen&&a!=='clear-imports'){S.importOpen=false}
  if(S.menuOpen){S.menuOpen=false}
  if(a==='set'){const v=b.dataset.v;S[b.dataset.k]=isNaN(+v)?v:+v;render()}
  else if(a==='mode-play'){const to=b.dataset.v;if(to!==S.play){S.teams.forEach((t,i)=>{if(t.name===DEFAULTS[S.play][i]||t.name===W().def+' '+(i+1))t.name=DEFAULTS[to][i]||((to==='solo'?'Joueur ':'Équipe ')+(i+1))});S.play=to;S.teams=S.teams.slice(0,MAX[to])}S.screen='setup';render();scrollTo(0,0)}
  else if(a==='go'){stopTimer();S.screen=b.dataset.v;S.error='';render();scrollTo(0,0)}
  else if(a==='open'){openPack(b.dataset.d)}
  else if(a==='deck'){const d=b.dataset.d;if(S.on[d])delete S.on[d];else S.on[d]=true;S.error='';render()}
  else if(a==='all-on'){deckList().forEach(d=>S.on[d.name]=true);render()}
  else if(a==='all-off'){S.on={};render()}
  else if(a==='color'){const t=S.teams[+b.dataset.i];const used=S.teams.map(x=>x.color);let k=PAWNS.indexOf(t.color);for(let n=0;n<PAWNS.length;n++){k=(k+1)%PAWNS.length;if(!used.includes(PAWNS[k]))break}t.color=PAWNS[k];render()}
  else if(a==='add-team'){const used=S.teams.map(t=>t.color);S.teams.push({name:W().def+' '+(S.teams.length+1),color:PAWNS.find(c=>!used.includes(c))||PAWNS[0],score:0});render()}
  else if(a==='rm-team'){S.teams.splice(+b.dataset.i,1);render()}
  else if(a==='import'){document.getElementById('file').click()}
  else if(a==='clear-imports'){IMPORTS.forEach(t=>delete S.on[t.deck]);IMPORTS=[];IMPORT_DECKS={};saveImports();S.report=null;render()}
  else if(a==='start'||a==='replay'){startGame()}
  else if(a==='menu'){stopTimer();S.screen='home';render();scrollTo(0,0)}
  else if(a==='lv'){choose(+b.dataset.l)}
  else if(a==='skip'){S.theme=draw(S.theme.deck,S.theme.id);render()}
  else if(a==='reveal'){reveal()}
  else if(a==='ok'){resolve(true)}
  else if(a==='ko'){resolve(false)}
  else if(a==='undo'){undo()}
  else if(a==='next'){nextTurn()}
  else if(a==='resume'){resumeGame()}
});
$app.addEventListener('input',e=>{
  const i=e.target.dataset.team; if(i!==undefined) S.teams[+i].name=e.target.value;
  if(e.target.id==='deck-q'){S.q=e.target.value;applySearch()}
});
document.addEventListener('click',e=>{
  if(!(S.menuOpen||S.importOpen)) return;
  if(!e.target.isConnected||e.target.closest('#app')||e.target.closest('.menu-pop')) return;
  S.menuOpen=false; S.importOpen=false; render();
});
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''});
document.addEventListener('keydown',e=>{
  const box=document.getElementById('unbox');
  if(!box.hidden){ if(e.key==='Escape') closePack(); return; }
  if((S.menuOpen||S.importOpen)&&e.key==='Escape'){S.menuOpen=false;S.importOpen=false;render();return}
  if(S.screen!=='game'||e.target.closest('input')) return;
  if(S.phase==='pick'&&/^[0-9]$/.test(e.key)){choose(e.key==='0'?10:+e.key)}
  else if(S.phase==='question'&&(e.key===' '||e.key==='Enter')){e.preventDefault();reveal()}
  else if(S.phase==='answer'&&(e.key==='j'||e.key==='J')){resolve(true)}
  else if(S.phase==='answer'&&(e.key==='f'||e.key==='F')){resolve(false)}
  else if(S.phase==='recap'&&(e.key===' '||e.key==='Enter')){e.preventDefault();nextTurn()}
});


/* ================= Panneau dev ================= */
const DEV_DEFAULT={speed:1,tear:520,stagger:160,rays:true,sparks:true,glow:true,holo:true,sheen:true,deal:true,shake:true,always:true,finish:''};
let DEV=(()=>{try{return {...DEV_DEFAULT,...JSON.parse(localStorage.getItem('connoisseur.dev')||'{}')}}catch(e){return {...DEV_DEFAULT}}})();
function saveDev(){try{localStorage.setItem('connoisseur.dev',JSON.stringify(DEV))}catch(e){}}
function applyDev(){
  const r=document.documentElement;
  r.style.setProperty('--k',(1/DEV.speed).toFixed(3));
  r.style.setProperty('--stag',DEV.stagger+'ms');
  ['rays','sparks','glow','holo','sheen','deal','shake'].forEach(k=>r.classList.toggle('no-'+k,!DEV[k]));
  r.classList.add('dev-on');
}
function devToast(t){const el=document.getElementById('dev-toast');if(el){el.textContent=t;setTimeout(()=>{if(el.textContent===t)el.textContent=''},1800)}}
function devPanel(){
  const D=deckList();
  const chk=(k,l)=>`<label><input type="checkbox" data-dev="${k}" ${DEV[k]?'checked':''}>${l}</label>`;
  return `<h4>Réglages dev <button class="icon-btn" data-devact="close" aria-label="Fermer">✕</button></h4>
    <div class="row"><span>Vitesse</span><input type="range" min="0.25" max="2.5" step="0.25" value="${DEV.speed}" data-dev="speed" aria-label="Vitesse"><b>×${DEV.speed}</b></div>
    <div class="row"><span>Déchirure</span><input type="range" min="150" max="1500" step="50" value="${DEV.tear}" data-dev="tear" aria-label="Durée de la déchirure"><b>${DEV.tear} ms</b></div>
    <div class="row"><span>Écart cartes</span><input type="range" min="40" max="500" step="20" value="${DEV.stagger}" data-dev="stagger" aria-label="Écart entre les cartes"><b>${DEV.stagger} ms</b></div>
    <div class="sep"></div>
    <div class="grid2">${chk('rays','Rayons')}${chk('sparks','Étincelles')}${chk('glow','Lumière')}${chk('holo','Reflet holo')}${chk('shake','Tremblement')}${chk('sheen','Brillance')}${chk('deal','Carte qui tourne')}${chk('always','Toujours animer')}</div>
    <div class="row"><span>Finition forcée</span><select data-dev="finish" aria-label="Finition forcée"><option value="">Aucune</option>${Object.entries(FINISHES).map(([k,f])=>`<option value="${k}" ${DEV.finish===k?'selected':''}>${f.label}</option>`).join('')}</select></div>
    <div class="sep"></div>
    <div class="row"><span>Tester</span><select id="dev-deck" aria-label="Deck à tester">${D.map(d=>`<option>${esc(d.name)}</option>`).join('')}</select></div>
    <div class="actions"><button class="btn small primary" data-devact="replay">Rejouer l’unboxing</button><button class="btn small" data-devact="seen">Reset des anims</button><button class="btn small ghost" data-devact="defaults">Réglages par défaut</button></div>
    <div class="toast" id="dev-toast"></div>`;
}
(function initDev(){
  const btn=document.createElement('button'); btn.className='dev-btn'; btn.textContent='DEV'; btn.setAttribute('aria-expanded','false');
  const pan=document.createElement('div'); pan.className='dev'; pan.hidden=true; pan.id='dev';
  document.body.append(btn,pan);
  const open=v=>{pan.hidden=!v;btn.setAttribute('aria-expanded',String(v));if(v)pan.innerHTML=devPanel()};
  btn.addEventListener('click',()=>open(pan.hidden));
  pan.addEventListener('input',e=>{
    const k=e.target.dataset.dev; if(!k) return;
    DEV[k]=e.target.type==='checkbox'?e.target.checked:(e.target.type==='range'?+e.target.value:e.target.value);
    if(e.target.type==='range'){const b=e.target.nextElementSibling;b.textContent=k==='speed'?'×'+DEV[k]:DEV[k]+' ms'}
    saveDev(); applyDev();
    if(k==='finish'&&S.screen!=='game'&&document.getElementById('unbox').hidden) render();
  });
  pan.addEventListener('click',e=>{
    const a=e.target.closest('[data-devact]')?.dataset.devact; if(!a) return;
    if(a==='close') open(false);
    else if(a==='seen'){SEEN={};try{localStorage.removeItem('connoisseur.seen')}catch(_){}closePack();devToast('Boosters refermés : l’animation rejouera partout.')}
    else if(a==='defaults'){DEV={...DEV_DEFAULT};saveDev();applyDev();open(true);render();devToast('Réglages par défaut remis.')}
    else if(a==='replay'){const n=document.getElementById('dev-deck').value;closePack();delete SEEN[n];openPack(n)}
  });
  applyDev();
})();

/* ================= Démarrage (garde la partie lors d'une mise à jour) ================= */
function start(data){
  const p=data&&data.S;
  if(p&&p.teams&&p.teams[0]&&'score' in p.teams[0]){
    S={...S,...p};
    if(!S.on||typeof S.on!=='object') S.on={};
    delete S.off;
    if(S.q===undefined) S.q='';
    if(S.deckTurn===undefined) S.deckTurn=0;
    if(S.screen==='game'&&!(S.theme&&S.theme.deck)){ S.screen='decks'; S.live=false; }
    if(S.screen==='game'&&S.phase==='question') S.phase='answer';
    if(S.screen==='game'&&S.phase==='recap'&&!S.recap) S.phase='answer';
    if(S.recap) S.recap.anim=true;
    S.menuOpen=false; S.importOpen=false;
  }
  if(S.live===undefined) S.live=S.screen==='game';
  S.bankStatus='loading';
  render(); loadBank();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
