<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connoisseur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : écran de salon. Scores à gauche, grande carte de jeu à droite, decks à finitions (irisé, métal, or…) ; une seule ambiance sombre assumée. */
:root{
  color-scheme:dark;
  --ink:#0f1118; --panel:#181b25; --raise:#212533; --line:#2c3142;
  --text:#f4f1e8; --muted:#9aa0b4; --dim:#5d6377;
  --sco:#4d8dff; --mat:#ff5d62; --pla:#ffc83d; --imp:#35d99a; --int:#b678ff; --fin:#f4f1e8;
  --on-card:#12131a;
  --ok:#35d99a; --ko:#ff5d62;
  --f-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:clamp(16px,3vw,40px);padding-block:20px 32px}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pla);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.05}
.app{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

/* ---------- Boutons ---------- */
.btn{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,background .12s}
.btn:hover{background:var(--line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--text);color:var(--on-card);border-color:var(--text)}
.btn.primary:hover{background:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.kbd{font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.55;font-weight:600}

/* ---------- Accueil ---------- */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.hero h1{font-size:clamp(40px,7vw,92px);font-weight:800;letter-spacing:-.02em}
.hero h1 em,.brand em{font-style:normal;color:var(--pla)}
.hero p{margin:10px 0 0;color:var(--muted);max-width:56ch}
.stripe{display:flex;gap:6px}
.stripe span{width:34px;height:34px;border-radius:8px}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{font-size:22px;font-weight:700}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.team-row{display:flex;gap:8px;align-items:center}
.team-row input[type=text]{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--ink) inset}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text);background:var(--raise)}
.field{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.seg button.on{background:var(--text);color:var(--on-card);border-color:var(--text)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:4px;accent-color:var(--pla);width:16px;height:16px;flex:none}
.check small{display:block;color:var(--muted)}
.report{border-radius:10px;padding:12px;background:var(--raise);font-size:14px}
.report ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.format{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.format table{border-collapse:collapse;font-size:13px;width:100%;min-width:420px}
.format th,.format td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.format th{background:var(--raise);font-weight:700}
.format tr:last-child td{border-bottom:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.start-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:flex-end}
.start-bar .btn.primary{font-size:20px;padding:14px 28px;font-family:var(--f-display)}
.err{color:var(--ko);font-weight:600}

/* ---------- Jeu ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px}
.scores{display:flex;flex-wrap:wrap;gap:8px}
.game{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:1fr}}
.scoreboard{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;border:1px solid transparent}
.srow.cur{border-color:var(--text);background:var(--raise)}
.srow .pawn-s{width:26px;height:26px;border-radius:50%;border:3px solid var(--panel)}
.srow .nm{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2vw,24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .pts{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,4vw,52px);line-height:1;font-variant-numeric:tabular-nums}
.srow .pts small{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.srow .bar{grid-column:2/4;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.srow .bar i{display:block;height:100%;border-radius:999px;transition:width .4s}
.round{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ranking{display:flex;flex-direction:column;gap:6px;min-width:min(420px,100%)}
.ranking div{display:flex;justify-content:space-between;gap:16px;font-size:18px;border-bottom:1px solid var(--line);padding:6px 0;font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.turn{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.turn b{color:var(--text);font-size:20px;font-family:var(--f-display)}
.turn .pawn-s{width:22px;height:22px;border-radius:50%;border:3px solid var(--panel);flex:none}
.flash{font-size:14px;color:var(--muted);min-height:20px}
.flash b{color:var(--text)}
.card{border-radius:22px;padding:clamp(20px,3vw,32px);color:var(--on-card);display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px -20px rgba(0,0,0,.7);position:relative;overflow:hidden}
.card .cat{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.card .ask{font-size:clamp(18px,2vw,22px);font-weight:600}
.card .theme{font-size:clamp(34px,5vw,64px);font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.card .bignum{font-family:var(--f-display);font-weight:800;font-size:clamp(72px,10vw,128px);line-height:.85;position:absolute;right:20px;top:14px;opacity:.18;font-variant-numeric:tabular-nums}
.card .q{font-size:clamp(22px,2.6vw,32px);font-weight:700;line-height:1.25;max-width:30ch;position:relative}
.card .a{background:var(--on-card);color:var(--text);border-radius:14px;padding:14px 18px;font-size:clamp(20px,2.4vw,28px);font-weight:700}
.card .a small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .note{font-size:14px;font-weight:600;opacity:.75}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{border:2px solid var(--on-card);background:transparent;color:var(--on-card);border-radius:12px;aspect-ratio:1.35;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,34px);transition:background .1s,color .1s}
.lv:hover:not([disabled]){background:var(--on-card);color:var(--text)}
.lv[disabled]{opacity:.25;cursor:not-allowed;text-decoration:line-through}
.timer{height:10px;background:rgba(18,19,26,.18);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--on-card);border-radius:999px;transition:width .2s linear}
.timer-row{display:flex;align-items:center;gap:12px;font-weight:700;font-variant-numeric:tabular-nums}
.timer-row .timer{flex:1}
.timer-row.out{color:#7a0b10}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{font-size:17px;padding:12px 20px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-card)}
.btn.ko{background:var(--ko);border-color:var(--ko);color:var(--on-card)}
.card .btn.dark{background:var(--on-card);color:var(--text);border-color:var(--on-card)}
.card .link{background:none;border:0;color:var(--on-card);text-decoration:underline;font-weight:600;padding:0;align-self:flex-start;font-size:14px;opacity:.75}
.final-card{background:var(--fin)}
.final-card::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:repeating-linear-gradient(90deg,var(--sco) 0 25%,var(--mat) 25% 50%,var(--pla) 50% 75%,var(--imp) 75% 100%)}
.shortcuts{font-size:13px;color:var(--dim)}

/* ---------- Victoire ---------- */
.win{min-height:70vh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:20px}
.win .label{color:var(--pla)}
.win h1{font-size:clamp(48px,10vw,140px);font-weight:800;letter-spacing:-.03em}
.confetti{display:flex;gap:8px}
.confetti span{width:clamp(30px,5vw,60px);aspect-ratio:1;border-radius:12px;animation:pop .6s ease-out both}
.confetti span:nth-child(2){animation-delay:.08s}.confetti span:nth-child(3){animation-delay:.16s}.confetti span:nth-child(4){animation-delay:.24s}
@keyframes pop{from{transform:scale(.3) rotate(-20deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Decks ---------- */
.decks-panel{grid-column:1/-1}
.decks-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.decks-head .hint{margin-top:6px}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;padding:4px 8px 8px 0}
.deck{position:relative;overflow:hidden;border:0;border-radius:16px;padding:16px 16px 14px;min-height:168px;text-align:left;color:var(--on-card);display:flex;flex-direction:column;gap:8px;box-shadow:5px 5px 0 -1px var(--ink),6px 6px 0 0 rgba(244,241,232,.35),10px 10px 0 -1px var(--ink),11px 11px 0 0 rgba(244,241,232,.18);transition:transform .15s ease,filter .2s ease,opacity .2s ease}
.deck:hover{transform:translateY(-3px) rotate(-.6deg)}
.deck.off{filter:grayscale(1) brightness(.42);opacity:.75;box-shadow:none}
.deck.off:hover{filter:grayscale(.4) brightness(.7)}
.deck h3{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:auto;padding-right:28px;overflow-wrap:anywhere}
.deck p{margin:0;font-size:13px;font-weight:500;opacity:.8}
.deck .meta{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;opacity:.75;position:relative}
.deck .tick{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--on-card);color:var(--text);display:grid;place-items:center;font-size:14px;font-weight:800;z-index:1}
.deck.off .tick{background:transparent;border:2px solid var(--on-card);color:var(--on-card)}
.deck > *{position:relative;z-index:1}
.card > *:not(.bignum){position:relative;z-index:1}
.shine{background-size:100% 100%}
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);background-size:260% 100%;background-position:130% 0;mix-blend-mode:soft-light;pointer-events:none;animation:sheen 5s ease-in-out infinite}
.deck.shine:hover::after{animation-duration:1.6s}
@keyframes sheen{0%{background-position:130% 0}55%,100%{background-position:-130% 0}}
.glow{box-shadow:0 0 34px -4px #ff4fb0,0 0 0 1px rgba(255,255,255,.35) inset}
.deck.glow{box-shadow:0 0 28px -6px #ff4fb0,5px 5px 0 -1px var(--ink),6px 6px 0 0 rgba(255,79,176,.5)}
.stripe span{position:relative;overflow:hidden}
.fmt summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.fmt[open] summary{margin-bottom:10px}
.fmt .hint{margin-top:10px}
</style>
</head>
<body>

<div id="app" class="app"></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv,.ods" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ================= Finitions des decks ================= */
const FINISHES = {
  irise:{label:'Irisé', bg:'linear-gradient(115deg,#ffc8ee 0%,#c4ecff 22%,#dcffc9 44%,#fff0bd 66%,#e3ccff 88%,#ffc8ee 100%)', fx:'shine'},
  metal:{label:'Métal', bg:'linear-gradient(160deg,#f1f3f6 0%,#b4bac4 38%,#e9ecf0 52%,#9aa2ae 78%,#d7dbe1 100%)', fx:'shine'},

  cuivre:{label:'Cuivre', bg:'linear-gradient(135deg,#ffd5b8 0%,#d0855a 38%,#ffc9a3 55%,#b5683f 80%,#e9a37b 100%)', fx:'shine'},
  nacre:{label:'Nacre', bg:'linear-gradient(135deg,#fffaf2 0%,#efe2f7 30%,#ddf3f1 60%,#fbefe1 100%)', fx:'shine'},
  neon:{label:'Néon', bg:'#ff4fb0', fx:'glow'},

  bleu:{label:'Bleu', bg:'#4d8dff', fx:''},
  rouge:{label:'Rouge', bg:'#ff5d62', fx:''},
  jaune:{label:'Jaune', bg:'#ffc83d', fx:''},
  vert:{label:'Vert', bg:'#35d99a', fx:''},
  violet:{label:'Violet', bg:'#b678ff', fx:''},
  craie:{label:'Craie', bg:'#f4f1e8', fx:''}
};
const FINISH_CYCLE = ['irise','metal','or','neon','cuivre','retro','nacre','bleu','vert','violet','rouge','jaune'];
const FINISH_ALIASES = {irise:'irise',holo:'irise',holographique:'irise',arcenciel:'irise',metal:'metal',metallique:'metal',argent:'metal',chrome:'metal',acier:'metal',or:'or',dore:'or',gold:'or',cuivre:'cuivre',bronze:'cuivre',nacre:'nacre',perle:'nacre',neon:'neon',fluo:'neon',retro:'retro',vaporwave:'retro',bleu:'bleu',rouge:'rouge',jaune:'jaune',vert:'vert',violet:'violet',craie:'craie',blanc:'craie'};
function finishFrom(v){
  const raw=String(v??'').trim();
  if(/^#[0-9a-f]{3,8}$/i.test(raw)) return raw;
  const n=norm(raw).replace(/[^a-z]/g,'');
  return FINISH_ALIASES[n]||null;
}
function finishOf(f){ return FINISHES[f] || (f&&f[0]==='#'?{label:f,bg:f,fx:''}:FINISHES.craie); }

/* ================= Joueurs ================= */
const PAWNS = ['#ffffff','#ff7ab6','#ff9f43','#5ee7ff','#c6ff5e','#8b5cf6','#ffe066','#f87171','#94a3b8','#2dd4bf'];
const MAX = {teams:6, solo:10};
const W = () => S.play==='solo' ? {one:'joueur',a:'un joueur',Many:'Joueurs',def:'Joueur'} : {one:'équipe',a:'une équipe',Many:'Équipes',def:'Équipe'};
const DEFAULTS = {teams:['Les Loutres','Les Cornichons'], solo:['Joueur 1','Joueur 2']};

/* ================= Deck intégré ================= */

  ['Vins et vignobles',[

  ['Jeux vidéo',[

  ['Quel jeu de construction en cubes Microsoft a-t-il racheté en 2014 ?','Minecraft'],
  ['Quel éditeur français a publié le premier Rayman ?','Ubisoft'],
  ['En quelle année la Game Boy est-elle sortie au Japon ?','1989'],

function deckList(){

    const finish=m.finish||FINISH_CYCLE[i%FINISH_CYCLE.length];
    return {name, finish, desc:m.desc||'', src:m.src, themes};
  });
}

/* ================= Import Excel ================= */
function parseSheet(rows, sheetName, out, defDeck){
  let hi=-1;
  for(let r=0;r<Math.min(rows.length,10);r++){
    const h=(rows[r]||[]).map(norm);
    if(h.some(x=>x.startsWith('theme')) && h.some(x=>x.startsWith('question')||/^q\s*\d+$/.test(x))){hi=r;break}
    if(h.some(x=>x.startsWith('deck')) && h.some(x=>x.startsWith('finition')||x.startsWith('couleur'))){
      const di=h.findIndex(x=>x.startsWith('deck')), fi=h.findIndex(x=>x.startsWith('finition')||x.startsWith('couleur')), si=h.findIndex(x=>x.startsWith('desc'));
      for(let k=r+1;k<rows.length;k++){
        const row=rows[k]||[]; const name=String(row[di]??'').trim(); if(!name) continue;
        const f=finishFrom(row[fi]);
        if(String(row[fi]??'').trim()&&!f) out.warnings.push(`${sheetName}, ligne ${k+1} : finition « ${row[fi]} » inconnue, une finition sera choisie au hasard.`);
        out.decks[name]={...(f?{finish:f}:{}),...(si>=0&&String(row[si]??'').trim()?{desc:String(row[si]).trim()}:{})};
      }
      return;
    }
  }
  if(hi<0) return;
  const H=(rows[hi]).map(norm);
  const col=f=>H.findIndex(f);
  let di=col(x=>x.startsWith('deck')||x.startsWith('paquet'));
  if(di<0) di=col(x=>x.startsWith('cat'));
  const ti=col(x=>x.startsWith('theme')), ni=col(x=>x.startsWith('niv')||x.startsWith('level'));
  const map={};
  const get=(deck,name)=>{const k=deck+'|'+norm(name);return map[k]||(map[k]={deck,name:String(name).trim(),qs:Array(10).fill(null)})};
  let lastDeck=null,lastTheme=null;
  if(ni>=0){
    const qi=col(x=>x.startsWith('question')), ri=col(x=>x.startsWith('rep')||x.startsWith('answer'));
    for(let r=hi+1;r<rows.length;r++){
      const row=rows[r]||[]; const line=r+1;
      if(!row.some(v=>String(v??'').trim())) continue;
      const themeName=String(row[ti]??'').trim()||lastTheme;
      const cell=di>=0?String(row[di]??'').trim():'';
      const deck=cell||(themeName===lastTheme&&lastDeck)||lastDeck||defDeck;
      const lv=parseInt(row[ni],10), q=String(row[qi]??'').trim(), a=String(row[ri]??'').trim();
      if(!q&&!a) continue;
      if(!themeName){out.warnings.push(`${sheetName}, ligne ${line} : thème manquant, ligne ignorée.`);continue}
      lastTheme=themeName;lastDeck=deck;
      if(!(lv>=1&&lv<=10)){out.warnings.push(`${sheetName}, ligne ${line} : niveau « ${row[ni]??''} » invalide (1 à 10).`);continue}
      if(!q||!a){out.warnings.push(`${sheetName}, ligne ${line} : question ou réponse vide.`);continue}
      get(deck,themeName).qs[lv-1]={q,a};
    }
  } else {
    const qc={},rc={};
    H.forEach((h,i)=>{let m=h.match(/^(?:q|question)\s*(\d+)$/);if(m)qc[+m[1]]=i;m=h.match(/^(?:r|rep|reponse|answer)\s*(\d+)$/);if(m)rc[+m[1]]=i});
    for(let r=hi+1;r<rows.length;r++){
      const row=rows[r]||[];
      const themeName=String(row[ti]??'').trim(); if(!themeName) continue;
      const deck=(di>=0&&String(row[di]??'').trim())||defDeck;
      const t=get(deck,themeName);
      for(let l=1;l<=10;l++){const q=String(row[qc[l]]??'').trim(),a=String(row[rc[l]]??'').trim();if(q&&a)t.qs[l-1]={q,a}}
    }
  }
  Object.values(map).forEach(t=>{
    const n=t.qs.filter(Boolean).length;
    if(!n) return;
    if(n<10) out.warnings.push(`« ${t.name} » : ${n}/10 niveaux remplis, les autres seront grisés.`);
    out.themes.push(t);
  });
}
function parseWorkbook(buf, defDeck){
  const out={themes:[],decks:{},warnings:[]};
  const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
  wb.SheetNames.forEach(n=>parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}),n,out,defDeck));
  return out;
}
function loadBank(){
  if(!window.XLSX){S.bankStatus='error';render();return}
  fetch('themes.xlsx',{cache:'no-cache'})
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()})
    .then(buf=>{
      const out=parseWorkbook(buf,'Banque');
      BANK=out.themes.map((t,i)=>({id:'b'+i,src:'banque',...t}));
      BANK_DECKS=out.decks;
      S.bankStatus=BANK.length?'ok':'error';
    })
    .catch(()=>{S.bankStatus='error'})
    .finally(()=>{if(S.screen==='setup')render()});
}
function importFile(file){
  if(!window.XLSX){S.report={file:file.name,added:0,warnings:['La lecture Excel n’a pas pu se charger. Vérifiez la connexion puis réessayez.']};render();return}
  const fr=new FileReader();
  fr.onload=()=>{
    let out={themes:[],decks:{},warnings:[]};
    const base=file.name.replace(/\.[^.]+$/,'');
    try{ out=parseWorkbook(fr.result,base); }
    catch(e){out.warnings.push('Fichier illisible : enregistrez-le en .xlsx et réessayez.')}
    let added=0,replaced=0;
    out.themes.forEach(t=>{
      const i=IMPORTS.findIndex(x=>x.deck===t.deck&&norm(x.name)===norm(t.name));
      const obj={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),src:file.name,...t};
      if(i>=0){IMPORTS[i]=obj;replaced++}else{IMPORTS.push(obj);added++}
    });
    Object.assign(IMPORT_DECKS,out.decks);
    const decks=[...new Set(out.themes.map(t=>t.deck))];
    decks.forEach(d=>delete S.off[d]);
    if(!out.themes.length&&!out.warnings.length) out.warnings.push('Aucune carte trouvée. La première ligne doit contenir les colonnes Deck, Thème, Niveau, Question, Réponse.');
    saveImports();
    S.report={file:file.name,added,replaced,decks,warnings:out.warnings};
    render();
  };
  fr.readAsArrayBuffer(file);
}

/* ================= Logique de jeu ================= */
function draw(deck, exclude){
  const L=lib();
  let pool=L.filter(t=>t.deck===deck&&!S.used.includes(t.id)&&t.id!==exclude);
  if(!pool.length){S.used=S.used.filter(id=>L.find(t=>t.id===id)?.deck!==deck);pool=L.filter(t=>t.deck===deck&&t.id!==exclude)}
  if(!pool.length) pool=L.filter(t=>t.deck===deck);
  if(!pool.length) pool=L.filter(t=>!S.used.includes(t.id)&&t.id!==exclude);
  if(!pool.length) pool=L;
  const t=rnd(pool); S.used.push(t.id); return t;
}
function beginTurn(){
  stopTimer();
  S.level=null;
  const decks=activeDecks();
  S.theme=draw(decks[S.deckTurn%decks.length]);
  S.phase='pick';
}
function choose(l){
  if(S.phase!=='pick') return;
  if(!S.theme.qs[l-1]) return;
  S.level=l; S.phase='question'; startTimer(); render();
}
function reveal(){ if(S.phase!=='question') return; S.phase='answer'; stopTimer(); render(); }
function totalTurns(){ return S.rounds*S.teams.length }
function finish(){ stopTimer(); S.screen='win'; render(); }
function resolve(ok){
  if(S.phase!=='answer') return;
  S.history.push({scores:S.teams.map(t=>t.score),cur:S.cur,turn:S.turn,deckTurn:S.deckTurn,used:[...S.used]});
  const t=team();
  if(ok){ t.score+=S.level; S.flash=`<b>${esc(t.name)}</b> marque ${S.level} point${S.level>1?'s':''}.`; }
  else S.flash=S.level>=7?`<b>CON.</b> ${esc(t.name)} visait ${S.level} et repart avec zéro.`:`<b>${esc(t.name)}</b> ne marque rien.`;
  if(S.mode==='points'&&t.score>=S.goal) return finish();
  S.turn++; S.deckTurn++;
  if(S.mode==='rounds'&&S.turn>=totalTurns()) return finish();
  S.cur=(S.cur+1)%S.teams.length;
  beginTurn(); render();
}
function undo(){
  const h=S.history.pop(); if(!h) return;
  S.teams.forEach((t,i)=>t.score=h.scores[i]); S.cur=h.cur; S.turn=h.turn; S.deckTurn=h.deckTurn; S.used=h.used;
  S.screen='game'; S.flash='Dernier coup annulé.'; beginTurn(); render();
}
function startGame(){
  S.error='';
  S.teams.forEach((t,i)=>{if(!t.name.trim())t.name=W().def+' '+(i+1)});
  if(S.teams.length<2){S.error=S.play==='solo'?'Il faut au moins deux joueurs.':'Il faut au moins deux équipes.';render();return}
  if(!activeDecks().length){S.error='Ajoutez au moins un deck à la partie.';render();return}
  S.teams.forEach(t=>t.score=0);
  S.cur=0;S.turn=0;S.deckTurn=Math.floor(Math.random()*activeDecks().length);S.used=[];S.history=[];S.flash='';
  S.screen='game'; beginTurn(); render();
}

/* ================= Chrono ================= */
function startTimer(){ stopTimer(); if(!S.timer) return; deadline=Date.now()+S.timer*1000; tick=setInterval(updTimer,200); }
function stopTimer(){ if(tick){clearInterval(tick);tick=null} }
function updTimer(){
  const left=Math.max(0,deadline-Date.now()), bar=document.getElementById('tbar'), num=document.getElementById('tnum'), row=document.getElementById('trow');
  if(!bar) return;
  bar.style.width=(left/(S.timer*1000)*100)+'%';
  num.textContent=left>0?Math.ceil(left/1000)+' s':'Temps écoulé';
  row.classList.toggle('out',left===0);
  if(left===0) stopTimer();
}

    <span class="bar"><i style="width:${Math.min(100,t.score/max*100)}%;background:${t.color}"></i></span>
  </div>`).join('');
  const info=S.mode==='points'?`Premier à ${S.goal} points`:`Tour ${Math.min(S.rounds,Math.floor(S.turn/S.teams.length)+1)} / ${S.rounds}`;
  return `<div class="scoreboard"><span class="round">${info}</span>${rows}</div>`;
}
function viewCard(){
  const th=S.theme, ds=deckStyle(th.deck), label=esc(th.deck);
  if(S.phase==='pick'){
    const btns=Array.from({length:10},(_,i)=>`<button class="lv" data-a="lv" data-l="${i+1}" ${th.qs[i]?'':'disabled'}>${i+1}</button>`).join('');
    return `<div class="card ${ds.cls}" style="${ds.style}">
      <span class="cat">Deck · ${label}</span>
      <span class="ask">T’es con ou connoisseur en…</span>
      <h2 class="theme">${esc(th.name)}</h2>
      <div class="levels">${btns}</div>
      <button class="link" data-a="skip">Changer de carte</button>
    </div>`;
  }
  const qa=th.qs[S.level-1];
  const timer=S.timer&&S.phase==='question'?`<div class="timer-row" id="trow"><div class="timer"><i id="tbar" style="width:100%"></i></div><span id="tnum">${S.timer} s</span></div>`:'';
  const body=S.phase==='question'
    ? `${timer}<div class="actions"><button class="btn dark" data-a="reveal">Voir la réponse <span class="kbd">Espace</span></button></div>`
    : `<div class="a"><small>Réponse</small>${esc(qa.a)}</div>
       <div class="actions"><button class="btn ok" data-a="ok">Juste · +${S.level} <span class="kbd">J</span></button><button class="btn ko" data-a="ko">Faux <span class="kbd">F</span></button></div>`;
  return `<div class="card ${ds.cls}" style="${ds.style}">
    <span class="bignum" aria-hidden="true">${S.level}</span>
    <span class="cat">${label} · niveau ${S.level}</span>
    <span class="ask">${esc(th.name)}</span>
    <p class="q">${esc(qa.q)}</p>
    ${body}
  </div>`;
}
function viewGame(){
  const t=team();
  return `
  <div class="topbar">
    <span class="brand"><em>CON</em>NOISSEUR</span>
    <div class="actions">
      <button class="btn small ghost" data-a="undo" ${S.history.length?'':'disabled'}>Annuler le coup</button>
      <button class="btn small ghost" data-a="menu">Menu</button>
    </div>
  </div>
  <div class="game">
    <div class="side">${viewScores()}</div>
    <div class="side">
      <div class="turn"><span class="pawn-s" style="background:${t.color}"></span><span>Au tour de <b>${esc(t.name)}</b></span></div>
      <div class="flash">${S.flash}</div>
      ${viewCard()}
      <span class="shortcuts">Clavier : 1 à 9 et 0 pour 10 · Espace révèle · J juste · F faux</span>
    </div>
  </div>`;
}
function viewWin(){
  const ranked=[...S.teams].sort((a,b)=>b.score-a.score);
  const top=ranked.filter(t=>t.score===ranked[0].score);
  const title=top.length>1?'Égalité':esc(top[0].name);
  const sub=top.length>1?`${top.map(t=>esc(t.name)).join(' et ')} terminent avec ${top[0].score} points.`:`${top[0].score} points.`;
  return `<section class="win">
    <div class="confetti">${['irise','or','neon','metal'].map(k=>`<span class="${FINISHES[k].fx}" style="background:${FINISHES[k].bg}"></span>`).join('')}</div>
    <span class="label">${top.length>1?'Fin de partie':'Victoire'}</span>
    <h1>${title}</h1>
    <p class="hint">${sub}</p>
    <div class="ranking">${ranked.map((t,i)=>`<div><span>${i+1}. ${esc(t.name)}</span><b>${t.score} pts</b></div>`).join('')}</div>
    <div class="actions"><button class="btn primary" data-a="replay">Rejouer avec ${S.play==='solo'?'les mêmes joueurs':'les mêmes équipes'}</button><button class="btn" data-a="undo" ${S.history.length?'':'disabled'}>Annuler le dernier coup</button><button class="btn" data-a="menu">Retour au menu</button></div>
  </section>`;
}

/* ================= Événements ================= */
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  const a=b.dataset.a;
  if(a==='set'){const v=b.dataset.v;S[b.dataset.k]=isNaN(+v)?v:+v;render()}
  else if(a==='deck'){const d=b.dataset.d;if(S.off[d])delete S.off[d];else S.off[d]=true;S.error='';render()}
  else if(a==='color'){const t=S.teams[+b.dataset.i];const used=S.teams.map(x=>x.color);let k=PAWNS.indexOf(t.color);for(let n=0;n<PAWNS.length;n++){k=(k+1)%PAWNS.length;if(!used.includes(PAWNS[k]))break}t.color=PAWNS[k];render()}
  else if(a==='play'){const to=b.dataset.v;if(to===S.play)return;S.teams.forEach((t,i)=>{if(t.name===DEFAULTS[S.play][i]||t.name===W().def+' '+(i+1))t.name=DEFAULTS[to][i]||((to==='solo'?'Joueur ':'Équipe ')+(i+1))});S.play=to;S.teams=S.teams.slice(0,MAX[to]);render()}
  else if(a==='add-team'){const used=S.teams.map(t=>t.color);S.teams.push({name:W().def+' '+(S.teams.length+1),color:PAWNS.find(c=>!used.includes(c))||PAWNS[0],score:0});render()}
  else if(a==='rm-team'){S.teams.splice(+b.dataset.i,1);render()}
  else if(a==='import'){document.getElementById('file').click()}
  else if(a==='clear-imports'){IMPORTS=[];IMPORT_DECKS={};saveImports();S.report=null;render()}
  else if(a==='start'||a==='replay'){startGame()}
  else if(a==='menu'){stopTimer();S.screen='setup';render()}
  else if(a==='lv'){choose(+b.dataset.l)}
  else if(a==='skip'){S.theme=draw(S.theme.deck,S.theme.id);render()}
  else if(a==='reveal'){reveal()}
  else if(a==='ok'){resolve(true)}
  else if(a==='ko'){resolve(false)}
  else if(a==='undo'){undo()}
});
$app.addEventListener('input',e=>{const i=e.target.dataset.team;if(i!==undefined)S.teams[+i].name=e.target.value});
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''});
document.addEventListener('keydown',e=>{
  if(S.screen!=='game'||e.target.closest('input')) return;
  if(S.phase==='pick'&&/^[0-9]$/.test(e.key)){choose(e.key==='0'?10:+e.key)}
  else if(S.phase==='question'&&(e.key===' '||e.key==='Enter')){e.preventDefault();reveal()}
  else if(S.phase==='answer'&&(e.key==='j'||e.key==='J')){resolve(true)}
  else if(S.phase==='answer'&&(e.key==='f'||e.key==='F')){resolve(false)}
});

/* ================= Démarrage (garde la partie lors d'une mise à jour) ================= */
function start(data){
  const p=data&&data.S;
  if(p&&p.teams&&p.teams[0]&&'score' in p.teams[0]){
    S={...S,...p};
    if(!S.off) S.off={};
    if(S.deckTurn===undefined) S.deckTurn=0;
    if(S.screen==='game'&&!(S.theme&&S.theme.deck)) S.screen='setup';
    if(S.screen==='game'&&S.phase==='question') S.phase='answer';
  }
  S.bankStatus='loading';
  render(); loadBank();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
