<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connoisseur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : écran de salon. Scores à gauche, grande carte de jeu à droite, decks à finitions (irisé, métal, or…) ; une seule ambiance sombre assumée. */
:root{
  color-scheme:dark;
  --ink:#0f1118; --panel:#181b25; --raise:#212533; --line:#2c3142;
  --text:#f4f1e8; --muted:#9aa0b4; --dim:#5d6377;
  --sco:#4d8dff; --mat:#ff5d62; --pla:#ffc83d; --imp:#35d99a; --int:#b678ff; --fin:#f4f1e8;
  --on-card:#12131a;
  --ok:#35d99a; --ko:#ff5d62;
  --f-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:clamp(16px,3vw,40px);padding-block:20px 32px}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pla);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.05}
.app{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

/* ---------- Boutons ---------- */
.btn{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,background .12s}
.btn:hover{background:var(--line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--text);color:var(--on-card);border-color:var(--text)}
.btn.primary:hover{background:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.kbd{font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.55;font-weight:600}

/* ---------- Accueil ---------- */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{font-size:22px;font-weight:700}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.team-row{display:flex;gap:8px;align-items:center}
.team-row input[type=text]{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--ink) inset}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text);background:var(--raise)}
.field{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.seg button.on{background:var(--text);color:var(--on-card);border-color:var(--text)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:4px;accent-color:var(--pla);width:16px;height:16px;flex:none}
.check small{display:block;color:var(--muted)}
.report{border-radius:10px;padding:12px;background:var(--raise);font-size:14px}
.report ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.format{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.format table{border-collapse:collapse;font-size:13px;width:100%;min-width:420px}
.format th,.format td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.format th{background:var(--raise);font-weight:700}
.format tr:last-child td{border-bottom:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--ko);font-weight:600}

/* ---------- Jeu ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px}
.scores{display:flex;flex-wrap:wrap;gap:8px}
.game{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:1fr}}
.scoreboard{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;border:1px solid transparent}
.srow.cur{border-color:var(--text);background:var(--raise)}
.srow .pawn-s{width:26px;height:26px;border-radius:50%;border:3px solid var(--panel)}
.srow .nm{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2vw,24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .pts{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,4vw,52px);line-height:1;font-variant-numeric:tabular-nums}
.srow .pts small{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.srow .bar{grid-column:2/4;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.srow .bar i{display:block;height:100%;border-radius:999px;transition:width .4s}
.round{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ranking{display:flex;flex-direction:column;gap:6px;min-width:min(420px,100%)}
.ranking div{display:flex;justify-content:space-between;gap:16px;font-size:18px;border-bottom:1px solid var(--line);padding:6px 0;font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.turn{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.turn b{color:var(--text);font-size:20px;font-family:var(--f-display)}
.turn .pawn-s{width:22px;height:22px;border-radius:50%;border:3px solid var(--panel);flex:none}
.flash{font-size:14px;color:var(--muted);min-height:20px}
.flash b{color:var(--text)}
.card{border-radius:22px;padding:clamp(20px,3vw,32px);color:var(--on-card);display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px -20px rgba(0,0,0,.7);position:relative;overflow:hidden}
.card .cat{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.card .ask{font-size:clamp(18px,2vw,22px);font-weight:600}
.card .theme{font-size:clamp(34px,5vw,64px);font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.card .bignum{font-family:var(--f-display);font-weight:800;font-size:clamp(72px,10vw,128px);line-height:.85;position:absolute;right:20px;top:14px;opacity:.18;font-variant-numeric:tabular-nums}
.card .q{font-size:clamp(22px,2.6vw,32px);font-weight:700;line-height:1.25;max-width:30ch;position:relative}
.card .a{background:var(--on-card);color:var(--text);border-radius:14px;padding:14px 18px;font-size:clamp(20px,2.4vw,28px);font-weight:700}
.card .a small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .note{font-size:14px;font-weight:600;opacity:.75}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{border:2px solid var(--on-card);background:transparent;color:var(--on-card);border-radius:12px;aspect-ratio:1.35;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,34px);transition:background .1s,color .1s}
.lv:hover:not([disabled]){background:var(--on-card);color:var(--text)}
.lv[disabled]{opacity:.25;cursor:not-allowed;text-decoration:line-through}
.timer{height:10px;background:rgba(18,19,26,.18);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--on-card);border-radius:999px;transition:width .2s linear}
.timer-row{display:flex;align-items:center;gap:12px;font-weight:700;font-variant-numeric:tabular-nums}
.timer-row .timer{flex:1}
.timer-row.out{color:#7a0b10}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{font-size:17px;padding:12px 20px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-card)}
.btn.ko{background:var(--ko);border-color:var(--ko);color:var(--on-card)}
.card .btn.dark{background:var(--on-card);color:var(--text);border-color:var(--on-card)}
.card .link{background:none;border:0;color:var(--on-card);text-decoration:underline;font-weight:600;padding:0;align-self:flex-start;font-size:14px;opacity:.75}
.final-card{background:var(--fin)}
.final-card::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:repeating-linear-gradient(90deg,var(--sco) 0 25%,var(--mat) 25% 50%,var(--pla) 50% 75%,var(--imp) 75% 100%)}
.shortcuts{font-size:13px;color:var(--dim)}

/* ---------- Victoire ---------- */
.win{min-height:70vh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:20px}
.win .label{color:var(--pla)}
.win h1{font-size:clamp(48px,10vw,140px);font-weight:800;letter-spacing:-.03em}
.confetti{display:flex;gap:8px}
.confetti span{width:clamp(30px,5vw,60px);aspect-ratio:1;border-radius:12px;animation:pop .6s ease-out both}
.confetti span:nth-child(2){animation-delay:.08s}.confetti span:nth-child(3){animation-delay:.16s}.confetti span:nth-child(4){animation-delay:.24s}
@keyframes pop{from{transform:scale(.3) rotate(-20deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ---------- Finitions ---------- */
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);background-size:260% 100%;background-position:130% 0;mix-blend-mode:soft-light;pointer-events:none;animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%{background-position:130% 0}55%,100%{background-position:-130% 0}}
.glow{box-shadow:0 0 34px -4px #ff4fb0,0 0 0 1px rgba(255,255,255,.35) inset}
.fmt summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.fmt[open] summary{margin-bottom:10px}
.fmt .hint{margin-top:10px}
.link-btn{background:none;border:0;color:var(--text);text-decoration:underline;padding:0;font-size:inherit}

/* ---------- Accueil ---------- */
.home{min-height:calc(100vh - 80px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center;gap:40px}
.home h1{font-size:clamp(52px,8.5vw,120px);font-weight:800;letter-spacing:-.035em;line-height:.95}
.home h1 em{font-style:normal;color:var(--pla)}
.home p{color:var(--muted);max-width:40ch;font-size:18px;margin:20px 0 34px}
.home-choice{display:flex;flex-wrap:wrap;gap:14px;max-width:560px}
.choice{flex:1 1 200px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:4px;transition:transform .15s,background .15s,border-color .15s}
.choice b{font-family:var(--f-display);font-size:28px;font-weight:800}
.choice span{color:var(--muted);font-size:14px}
.choice:hover{transform:translateY(-3px);border-color:var(--text);background:var(--raise)}
.fan{position:relative;height:360px;display:grid;place-items:center}
.fan-pack{position:absolute;width:180px;aspect-ratio:5/7.4;border-radius:6px 6px 8px 8px;color:var(--on-card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:18px 14px;transform:translateX(var(--x)) rotate(var(--r));box-shadow:0 24px 44px -18px rgba(0,0,0,.95),inset 0 0 0 1px rgba(255,255,255,.25);overflow:hidden}
.fan-pack:nth-child(2){z-index:2;transform:translateX(var(--x)) rotate(var(--r)) translateY(-16px)}
.fan-pack > *:not(.crimp){position:relative;z-index:1}
.fan-pack .pk-name{font-size:24px}
@media (max-width:800px){.home{grid-template-columns:1fr;min-height:auto;padding-top:10px}.fan{order:-1;height:220px}.fan-pack{width:120px}.fan-pack .pk-name{font-size:17px}}

/* ---------- Étapes ---------- */
.step-head{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.step-head .btn{margin-bottom:6px}
.step-title{font-size:clamp(34px,5vw,58px);font-weight:800;letter-spacing:-.025em}
.step-head .hint{font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 240px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.bottom-bar{position:sticky;bottom:env(safe-area-inset-bottom,0px);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:22px 0 14px;background:linear-gradient(180deg,transparent,var(--ink) 34%);z-index:5}
.btn.big{font-size:18px;padding:14px 26px;font-family:var(--f-display);margin-left:auto}
.sel{color:var(--muted)} .sel b{color:var(--text)}

/* ---------- Boosters ---------- */
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:24px 18px;padding:8px 8px 0 0}
.pack-wrap{position:relative;min-width:0}
.pack{position:relative;overflow:hidden;width:100%;aspect-ratio:5/7.4;border:0;border-radius:6px 6px 8px 8px;padding:22px 12px 20px;color:var(--on-card);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;box-shadow:0 12px 26px -14px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.25);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.pack > *:not(.crimp){position:relative;z-index:1}
@media (hover:hover){.pack:hover{transform:translateY(-6px) scale(1.03)}}
.pack-wrap.on .pack{box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--text),0 16px 30px -14px rgba(0,0,0,.95)}
.crimp{position:absolute;left:0;right:0;top:0;height:12px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,rgba(255,255,255,.28) 2px 4px);border-bottom:1px solid rgba(0,0,0,.18);z-index:2}
.crimp.bottom{top:auto;bottom:0;border-bottom:0;border-top:1px solid rgba(0,0,0,.18)}
.pk-brand{font-family:var(--f-display);font-weight:800;font-size:10px;letter-spacing:.14em;margin-top:6px}
.pk-brand em{font-style:normal;background:var(--on-card);color:var(--text);padding:1px 3px;border-radius:2px;margin-right:1px}
.pk-name{font-family:var(--f-display);font-weight:800;font-size:clamp(17px,1.8vw,21px);line-height:1;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.pk-foot{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px;opacity:.75}
.pk-toggle{position:absolute;right:-9px;top:-9px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:var(--raise);color:var(--text);font-weight:800;font-size:17px;line-height:1;z-index:3;display:grid;place-items:center;transition:transform .15s}
.pk-toggle:hover{transform:scale(1.12)}
.pack-wrap.on .pk-toggle{background:var(--text);color:var(--on-card)}

/* ---------- Unboxing ---------- */
.unbox{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 35%,rgba(40,44,62,.92),rgba(6,7,10,.96) 70%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-x:hidden;overflow-y:auto;opacity:0;transition:opacity .25s}
.unbox.in{opacity:1}
.ub-dialog{position:relative;width:min(980px,100%);display:flex;flex-direction:column;gap:22px;align-items:center}
.ub-close{position:absolute;top:0;right:0;z-index:6}
.ub-stage{position:relative;width:100%;min-height:440px;display:grid;place-items:center;justify-items:center}
.ub-stage > *{grid-area:1/1}
/* rayons et étincelles */
.ub-rays{position:absolute;left:50%;top:50%;translate:-50% -50%;width:140vmin;height:140vmin;max-width:900px;max-height:900px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.17) 0 5deg,transparent 5deg 16deg);-webkit-mask:radial-gradient(circle,#000 0%,transparent 60%);mask:radial-gradient(circle,#000 0%,transparent 60%);opacity:0;transform:scale(.25);transition:opacity .6s,transform .9s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.burst .ub-rays{opacity:1;transform:scale(1);animation:spin 16s linear infinite}
@keyframes spin{to{rotate:360deg}}
.ub-burst{position:absolute;left:50%;top:calc(50% - 150px);width:0;height:0;pointer-events:none;z-index:4}
.spark{position:absolute;left:0;top:0;width:var(--s);height:var(--s);border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 20px var(--pla);opacity:0}
.spark:nth-child(3n){background:var(--pla)}
.spark:nth-child(3n+1){background:#9fe6ff;box-shadow:0 0 10px #9fe6ff,0 0 20px #ff7ab6}
.burst .spark{animation:spark calc(1s * var(--k,1)) cubic-bezier(.1,.7,.3,1) calc(var(--t) * var(--k,1)) forwards}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.2)}}
/* le paquet */
.ub-pack{position:relative;z-index:3;width:min(250px,62vw);aspect-ratio:5/7.4;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 26px 28px rgba(0,0,0,.75));transition:transform .5s cubic-bezier(.3,.7,.3,1),opacity .4s}
@media (hover:hover){.ub-pack:hover{transform:scale(1.02)}}
.ub-pack:focus-visible{outline:3px solid var(--pla);outline-offset:6px;border-radius:8px}
.ub-piece{position:absolute;inset:0;border-radius:6px 6px 8px 8px;color:var(--on-card);overflow:hidden}
.ub-body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:30% 14px 22px}
.ub-body > *:not(.crimp):not(.ub-glow){position:relative;z-index:1}
.ub-body .pk-name{font-size:clamp(24px,3vw,30px)}
.ub-top{z-index:2;transform-origin:100% 20%;transition:transform calc(.8s * var(--k,1)) cubic-bezier(.4,-.25,.6,1),opacity calc(.8s * var(--k,1))}
.ub-notch{position:absolute;left:10px;top:12.5%;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.65;z-index:1}
.ub-glow{position:absolute;left:-15%;right:-15%;top:8%;height:46%;background:radial-gradient(ellipse at 50% 10%,#fff 0%,rgba(255,255,255,.75) 22%,rgba(255,255,255,0) 70%);opacity:0;transition:opacity .35s;z-index:2}
.ub-line{position:absolute;inset:0;width:100%;height:100%;z-index:4;overflow:visible;pointer-events:none}
.ub-line .guide{fill:none;stroke:rgba(18,19,26,.5);stroke-width:1.4;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.ub-cut{position:absolute;inset:0;width:100%;height:100%;z-index:5;overflow:visible;pointer-events:none;clip-path:inset(-20% calc(100% - var(--p,0) * 100%) -20% -4%);transition:clip-path var(--lineMs,500ms) linear}
.ub-cut polyline{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 9px #ffc83d)}
.dragging .ub-cut{transition:none}
.dragging .ub-pack{animation:jitter .1s linear infinite;cursor:grabbing}
@keyframes jitter{50%{transform:translate(.8px,-.6px) rotate(-.4deg)}}
.tearing .ub-pack{animation:shake .5s}
@keyframes shake{15%{transform:rotate(-3deg)}35%{transform:rotate(2.5deg) translateY(2px)}55%{transform:rotate(-2deg)}75%{transform:rotate(1deg)}}
.torn .ub-top{transform:translate(90px,-230px) rotate(42deg);opacity:0}
.torn .ub-line,.torn .ub-cut{opacity:0;transition:opacity .25s}
.torn .ub-glow{opacity:1}
.burst .ub-pack{transform:translateY(70px) scale(.9);opacity:.0;transition-delay:.25s}
.ub-hint{align-self:end;margin:0;color:var(--muted);font-size:14px;transition:opacity .2s}
.tearing .ub-hint{opacity:0}
.opened .ub-pack,.opened .ub-hint{display:none}
/* les cartes */
.ub-cards{display:none;position:relative;z-index:5;width:100%;max-width:100%;grid-template-columns:repeat(auto-fit,minmax(min(140px,40vw),175px));justify-content:center;gap:16px;perspective:1300px}
.opened .ub-cards{display:grid}
.ub-card{aspect-ratio:63/88;opacity:0;animation:rise calc(.7s * var(--k,1)) cubic-bezier(.2,.9,.25,1.15) forwards;animation-delay:calc(var(--i) * var(--stag,160ms) * var(--k,1))}
@keyframes rise{0%{opacity:0;transform:translateY(200px) scale(.45) rotate(var(--r))}60%{opacity:1}100%{opacity:1;transform:none}}
.ub-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(180deg);animation:flip calc(.7s * var(--k,1)) cubic-bezier(.3,.7,.3,1) forwards;animation-delay:calc((var(--i) * var(--stag,160ms) + 650ms) * var(--k,1))}
@keyframes flip{0%{transform:rotateY(180deg)}70%{transform:rotateY(-12deg) scale(1.08)}100%{transform:rotateY(0) scale(1)}}
.ub-back,.ub-front{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px;overflow:hidden}
.ub-back{transform:rotateY(180deg);justify-content:center;background:repeating-linear-gradient(45deg,var(--panel) 0 10px,var(--raise) 10px 20px);border:2px solid var(--line)}
.ub-back span{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:.95;color:var(--muted)}
.ub-back em{font-style:normal;color:var(--pla)}
.ub-front{color:var(--on-card);justify-content:space-between;box-shadow:inset 0 0 0 2px rgba(18,19,26,.85),inset 0 0 0 6px rgba(255,255,255,.35),0 18px 34px -14px rgba(0,0,0,.95)}
.ub-front > *{position:relative;z-index:1}
.ub-front b{font-family:var(--f-display);font-size:clamp(19px,2vw,23px);line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
.ub-front .meta{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.ub-front .holo{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.9) 44%,rgba(160,230,255,.7) 50%,rgba(255,170,230,.7) 56%,transparent 70%);background-size:260% 100%;background-position:160% 0;mix-blend-mode:overlay;animation:holo calc(1.1s * var(--k,1)) ease-out forwards;animation-delay:calc((var(--i) * var(--stag,160ms) + 1150ms) * var(--k,1))}
@keyframes holo{to{background-position:-160% 0}}
.quick .ub-card{animation-duration:.4s;animation-delay:calc(var(--i) * 70ms)}
.quick .ub-inner{animation-duration:.45s;animation-delay:calc(var(--i) * 70ms + 200ms)}
.quick .ub-front .holo{animation-delay:calc(var(--i) * 70ms + 450ms)}
.quick .ub-rays{opacity:.6;transform:scale(1);animation:spin 16s linear infinite}
/* infos */
.ub-info{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;opacity:0;transform:translateY(12px);transition:opacity .45s,transform .45s;pointer-events:none}
.done .ub-info{opacity:1;transform:none;pointer-events:auto}
.ub-info h3{font-size:clamp(26px,3vw,34px);font-weight:800}
.ub-info p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.ub-card{opacity:1}.ub-inner{transform:none}.ub-rays{display:none}}

/* ---------- Carte de jeu format TCG ---------- */
.tcg{position:relative;overflow:hidden;width:min(100%,470px);aspect-ratio:63/88;margin:0 auto;border-radius:20px;padding:12px;box-shadow:0 26px 50px -24px rgba(0,0,0,.95),inset 0 0 0 1px rgba(255,255,255,.3);color:var(--on-card)}
.tcg-in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:7px;background:#f3eee0;border-radius:12px;padding:9px;box-shadow:inset 0 0 0 2px rgba(18,19,26,.85)}
.tcg-title{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fbf8ef;border:2px solid var(--on-card);border-radius:10px;padding:6px 6px 6px 12px}
.tcg-title h2{font-size:clamp(19px,2.2vw,24px);font-weight:800;letter-spacing:-.01em;line-height:1.05;overflow-wrap:anywhere}
.cost{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;border:2px solid var(--on-card);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.tcg-art{position:relative;overflow:hidden;flex:1 1 auto;min-height:150px;border:2px solid var(--on-card);border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:14px 16px;box-shadow:inset 0 0 40px rgba(0,0,0,.18)}
.tcg-art > *{position:relative;z-index:1}
.art-kicker{font-size:14px;font-weight:700}
.art-theme{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,4.6vw,54px);line-height:.95;letter-spacing:-.025em;overflow-wrap:anywhere;text-wrap:balance}
.art-num{font-family:var(--f-display);font-weight:800;font-size:clamp(88px,12vw,140px);line-height:.8;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tcg-type{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:#fbf8ef;border:2px solid var(--on-card);border-radius:7px;padding:5px 10px}
.tcg-type span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tcg-text{background:#fbf8ef;border:2px solid var(--on-card);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tcg-q{margin:0;font-size:clamp(18px,2.1vw,23px);font-weight:700;line-height:1.25}
.tcg-a{background:var(--on-card);color:var(--text);border-radius:8px;padding:10px 14px;font-size:clamp(18px,2.1vw,23px);font-weight:700}
.tcg-a small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tcg-levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.gem{aspect-ratio:1;border-radius:50%;border:2px solid var(--on-card);background:#fff;color:var(--on-card);font-family:var(--f-display);font-weight:800;font-size:clamp(17px,2.2vw,22px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .1s,background .1s,color .1s}
.gem:hover:not([disabled]){background:var(--on-card);color:var(--text);transform:translateY(-2px)}
.gem[disabled]{opacity:.25;cursor:not-allowed}
.tcg-foot{display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.7;padding:0 4px}
.tcg-foot em{font-style:normal;background:var(--on-card);color:var(--text);padding:0 3px;border-radius:2px}
.tcg .timer-row{font-size:14px}
.tcg-actions{justify-content:center}
.tcg-actions .btn{font-size:17px;padding:12px 22px}
.tcg.deal{animation:dealcard .55s cubic-bezier(.2,.8,.2,1)}
@keyframes dealcard{from{opacity:0;transform:perspective(900px) rotateY(-80deg) translateX(60px)}to{opacity:1;transform:none}}
@media (max-width:900px){
  .side.play{order:-1}
  .scoreboard{padding:10px;gap:4px}
  .srow{padding:8px 10px;gap:10px}
  .srow .nm{font-size:16px}
  .srow .pts{font-size:26px}
  .srow .bar{height:4px}
  .tcg{padding:9px;border-radius:16px}
  .tcg-art{min-height:120px}
}

/* ---------- Panneau dev ---------- */
.dev-btn{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80;border:1px solid var(--line);background:var(--raise);color:var(--muted);border-radius:8px;padding:6px 9px;font-size:11px;font-weight:800;letter-spacing:.1em}
.dev-btn:hover,.dev-btn[aria-expanded="true"]{color:var(--on-card);background:var(--pla);border-color:var(--pla)}
.dev{position:fixed;left:12px;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:80;width:min(320px,calc(100vw - 24px));max-height:calc(100vh - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.9);font-size:14px}
.dev h4{margin:0;font-family:var(--f-display);font-size:16px;display:flex;justify-content:space-between;align-items:center}
.dev .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dev .row span{color:var(--muted)}
.dev .row b{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px;text-align:right}
.dev input[type=range]{flex:1;accent-color:var(--pla);min-width:0}
.dev input[type=checkbox]{accent-color:var(--pla);width:16px;height:16px}
.dev select{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.dev .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.dev .grid2 label{display:flex;gap:8px;align-items:center;color:var(--text)}
.dev .sep{height:1px;background:var(--line)}
.dev .actions{gap:8px}
.dev .toast{color:var(--imp);font-size:13px;min-height:16px}
html.dev-on .bottom-bar{padding-left:56px}
html.no-rays .ub-rays{display:none}
html.no-sparks .ub-burst{display:none}
html.no-holo .holo{display:none}
html.no-sheen .shine::after{display:none}
html.no-deal .tcg.deal{animation:none}
html.no-shake .tearing .ub-pack,html.no-shake .dragging .ub-pack{animation:none}
html.no-glow .ub-glow{display:none}
</style>
</head>
<body>

<div id="app" class="app"></div>
<div id="unbox" class="unbox" hidden></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv,.ods" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ================= Finitions des decks ================= */
const FINISHES = {
  irise:{label:'Irisé', bg:'linear-gradient(115deg,#ffc8ee 0%,#c4ecff 22%,#dcffc9 44%,#fff0bd 66%,#e3ccff 88%,#ffc8ee 100%)', fx:'shine'},
  metal:{label:'Métal', bg:'linear-gradient(160deg,#f1f3f6 0%,#b4bac4 38%,#e9ecf0 52%,#9aa2ae 78%,#d7dbe1 100%)', fx:'shine'},
  or:{label:'Or', bg:'linear-gradient(135deg,#fff0b3 0%,#e2b54a 35%,#fff4c4 52%,#c9962f 78%,#f3d77a 100%)', fx:'shine'},
  cuivre:{label:'Cuivre', bg:'linear-gradient(135deg,#ffd5b8 0%,#d0855a 38%,#ffc9a3 55%,#b5683f 80%,#e9a37b 100%)', fx:'shine'},
  nacre:{label:'Nacre', bg:'linear-gradient(135deg,#fffaf2 0%,#efe2f7 30%,#ddf3f1 60%,#fbefe1 100%)', fx:'shine'},
  neon:{label:'Néon', bg:'#ff4fb0', fx:'glow'},
  retro:{label:'Rétro', bg:'linear-gradient(180deg,#ffb1e1 0%,#ffd3a8 50%,#a8e3ff 100%)', fx:''},
  bleu:{label:'Bleu', bg:'#4d8dff', fx:''},
  rouge:{label:'Rouge', bg:'#ff5d62', fx:''},
  jaune:{label:'Jaune', bg:'#ffc83d', fx:''},
  vert:{label:'Vert', bg:'#35d99a', fx:''},
  violet:{label:'Violet', bg:'#b678ff', fx:''},
  craie:{label:'Craie', bg:'#f4f1e8', fx:''}
};
const FINISH_CYCLE = ['irise','metal','or','neon','cuivre','retro','nacre','bleu','vert','violet','rouge','jaune'];
const FINISH_ALIASES = {irise:'irise',holo:'irise',holographique:'irise',arcenciel:'irise',metal:'metal',metallique:'metal',argent:'metal',chrome:'metal',acier:'metal',or:'or',dore:'or',gold:'or',cuivre:'cuivre',bronze:'cuivre',nacre:'nacre',perle:'nacre',neon:'neon',fluo:'neon',retro:'retro',vaporwave:'retro',bleu:'bleu',rouge:'rouge',jaune:'jaune',vert:'vert',violet:'violet',craie:'craie',blanc:'craie'};
function finishFrom(v){
  const raw=String(v??'').trim();
  if(/^#[0-9a-f]{3,8}$/i.test(raw)) return raw;
  const n=norm(raw).replace(/[^a-z]/g,'');
  return FINISH_ALIASES[n]||null;
}
function finishOf(f){ return FINISHES[f] || (f&&f[0]==='#'?{label:f,bg:f,fx:''}:FINISHES.craie); }

/* ================= Joueurs ================= */
const PAWNS = ['#ffffff','#ff7ab6','#ff9f43','#5ee7ff','#c6ff5e','#8b5cf6','#ffe066','#f87171','#94a3b8','#2dd4bf'];
const MAX = {teams:6, solo:10};
const W = () => S.play==='solo' ? {one:'joueur',a:'un joueur',Many:'Joueurs',def:'Joueur'} : {one:'équipe',a:'une équipe',Many:'Équipes',def:'Équipe'};
const DEFAULTS = {teams:['Les Loutres','Les Cornichons'], solo:['Joueur 1','Joueur 2']};

/* ================= Deck intégré ================= */
const SAMPLE_DECK = {name:'Échauffement', finish:'nacre', desc:'Les cartes de démarrage, toujours disponibles.'};
const RAW = [
  ['Planètes du système solaire',[
  ['Sur quelle planète vivons-nous ?','La Terre'],
  ['Quelle planète est surnommée la planète rouge ?','Mars'],

  ['Quelle planète est célèbre pour ses grands anneaux bien visibles ?','Saturne'],
  ['Combien de planètes compte le système solaire depuis 2006 ?','8'],
  ['Quelle planète tourne « couchée », avec un axe incliné d’environ 98° ?','Uranus'],
  ['Comment s’appelle le plus grand satellite de Saturne ?','Titan'],
  ['Sur quelle planète une journée dure-t-elle plus longtemps qu’une année ?','Vénus'],
  ['Comment s’appelle le plus haut volcan connu du système solaire, sur Mars ?','Olympus Mons']]],
  ['Géographie de la France',[
  ['Quelle est la capitale de la France ?','Paris'],
  ['Quel fleuve traverse Paris ?','La Seine'],
  ['Quel est le plus haut sommet de France ?','Le mont Blanc'],
  ['Quel est le plus long fleuve entièrement français ?','La Loire'],
  ['Dans quelle ville se trouve la Cité de l’espace ?','Toulouse'],
  ['Combien de régions compte la France métropolitaine depuis 2016 ?','13'],
  ['Quel département porte le numéro 01 ?','L’Ain'],
  ['Quelle est la préfecture de la Corrèze ?','Tulle'],
  ['Après la Corse, quelle est la plus grande île de France métropolitaine ?','L’île d’Oléron'],
  ['Quel est le point culminant du Massif central ?','Le puy de Sancy']]],
  ['Vins et vignobles',[
  ['De quelle région vient le champagne ?','La Champagne'],
  ['Quel ustensile sert à retirer un bouchon de liège ?','Un tire-bouchon'],
  ['Comment s’appelle la personne qui conseille les vins au restaurant ?','Le sommelier'],
  ['Le Beaujolais nouveau sort quel jeudi de novembre ?','Le troisième'],
  ['Quel cépage blanc domine en Bourgogne, notamment à Chablis ?','Le chardonnay'],
  ['Quelle est la contenance d’un magnum ?','1,5 litre'],
  ['Quel cépage rouge domine dans les vins du Beaujolais ?','Le gamay'],
  ['Quel insecte a ravagé le vignoble français à la fin du XIXe siècle ?','Le phylloxéra'],
  ['Comment appelle-t-on la couche de levures sous laquelle vieillit le vin jaune ?','Le voile'],
  ['Comment s’appelle la bouteille de 62 cl réservée au vin jaune ?','Le clavelin']]],
  ['Impôts et paperasse',[
  ['Combien de fois par an déclare-t-on ses revenus ?','Une fois'],
  ['Que signifie TVA ?','Taxe sur la valeur ajoutée'],
  ['Quel est le taux normal de TVA en France ?','20 %'],
  ['Comment s’appelle le prélèvement de l’impôt sur le salaire, en place depuis 2019 ?','Le prélèvement à la source'],
  ['Quel taux réduit de TVA s’applique à la plupart des produits alimentaires ?','5,5 %'],
  ['Quel impôt local a été supprimé pour les résidences principales ?','La taxe d’habitation'],
  ['Comment s’appelle le mécanisme qui divise le revenu imposable selon le nombre de parts ?','Le quotient familial'],
  ['Que signifie le sigle URSSAF ?','Union de recouvrement des cotisations de sécurité sociale et d’allocations familiales'],
  ['Qui est considéré comme l’inventeur de la TVA, en 1954 ?','Maurice Lauré'],

  ['Pâtisserie',[
  ['Quelle viennoiserie a la forme d’une lune ?','Le croissant'],
  ['Quelle pâtisserie allongée est garnie de crème et glacée au café ou au chocolat ?','L’éclair'],

  ['Avec quelle pâte fait-on les éclairs et les chouquettes ?','La pâte à choux'],
  ['Quel gâteau rend hommage à une course cycliste créée en 1891 ?','Le Paris-Brest'],
  ['Quelle crème mélange crème pâtissière et beurre ?','La crème mousseline'],
  ['Quel gâteau breton signifie « gâteau au beurre » ?','Le kouign-amann'],
  ['Quel pâtissier a créé l’Ispahan, au parfum rose, litchi et framboise ?','Pierre Hermé'],
  ['Quel gâteau en couches associe biscuit Joconde, crème au beurre café et ganache ?','L’opéra'],
  ['Quel chef du début du XIXe siècle est considéré comme le père de la pâtisserie moderne ?','Antonin Carême']]],
  ['Jeux vidéo',[
  ['Quel jeu consiste à empiler des blocs qui tombent pour compléter des lignes ?','Tetris'],
  ['Quelle entreprise japonaise fabrique la Switch ?','Nintendo'],
  ['Dans quel pays Tetris a-t-il été créé ?','En URSS (Russie)'],
  ['Quelle console Sony est sortie au Japon en 1994 ?','La PlayStation'],
  ['Quel jeu de construction en cubes Microsoft a-t-il racheté en 2014 ?','Minecraft'],
  ['Quel éditeur français a publié le premier Rayman ?','Ubisoft'],
  ['En quelle année la Game Boy est-elle sortie au Japon ?','1989'],
  ['Qui a créé Tetris ?','Alexeï Pajitnov'],
  ['Quel jeu d’arcade Taito de 1978 met en scène des envahisseurs extraterrestres ?','Space Invaders'],
  ['Quel jeu de 1971 est considéré comme le premier jeu d’arcade commercial ?','Computer Space']]],
  ['Pigeons',[
  ['Quel oiseau picore les miettes sur toutes les places des villes ?','Le pigeon'],
  ['Comment appelle-t-on le pigeon qui transporte des messages ?','Le pigeon voyageur'],
  ['Comment s’appelle le petit du pigeon ?','Le pigeonneau'],
  ['Quel bâtiment sert à abriter des pigeons ?','Le pigeonnier (ou colombier)'],

  ['Comment s’appelle la langue râpeuse couverte de milliers de dents de l’escargot ?','La radula'],

const SAMPLES = RAW.map(([name,qs],i)=>({id:'s'+i,deck:SAMPLE_DECK.name,name,src:'sample',qs:qs.map(([q,a])=>({q,a}))}));

/* ================= Stockage des imports ================= */
const LS_KEY='connoisseur.imports.v2', LS_OLD='ttmc.imports.v1';
const OLD_CATS={scolaire:'Savoirs',mature:'Vie d’adulte',plaisir:'Loisirs',improbable:'Insolite'};
function loadImports(){
  try{
    const v=JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(v&&Array.isArray(v.themes)) return {themes:v.themes,decks:v.decks||{}};
    const old=JSON.parse(localStorage.getItem(LS_OLD)||'[]');
    if(Array.isArray(old)&&old.length) return {themes:old.map(t=>({...t,deck:t.deck||OLD_CATS[t.cat]||'Import'})),decks:{}};
  }catch(e){}
  return {themes:[],decks:{}};
}
function saveImports(){try{localStorage.setItem(LS_KEY,JSON.stringify({themes:IMPORTS,decks:IMPORT_DECKS}))}catch(e){}}
let {themes:IMPORTS, decks:IMPORT_DECKS} = loadImports();
let BANK = [], BANK_DECKS = {};

/* ================= État ================= */
let S = {
  screen:'home', q:'',
  teams:[{name:'Les Loutres',color:PAWNS[1],score:0},{name:'Les Cornichons',color:PAWNS[4],score:0}],
  play:'teams', mode:'points', goal:30, rounds:8, timer:30, on:{}, bankStatus:'loading',
  cur:0, turn:0, deckTurn:0, phase:null, theme:null, level:null, used:[], history:[], flash:'', report:null, error:'', winner:null
};
let tick=null, deadline=0;

const $app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const team=()=>S.teams[S.cur];
function norm(s){return String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}

/* ================= Decks ================= */
function allThemes(){ return [...SAMPLES,...BANK,...IMPORTS]; }
function deckList(){
  const meta={[SAMPLE_DECK.name]:{...SAMPLE_DECK,src:'sample'}};
  Object.entries(BANK_DECKS).forEach(([k,v])=>meta[k]={...meta[k],...v,name:k,src:meta[k]?.src||'banque'});
  Object.entries(IMPORT_DECKS).forEach(([k,v])=>meta[k]={...meta[k],...v,name:k,src:meta[k]?.src||'import'});
  const order=[], seen={};
  allThemes().forEach(t=>{ if(!seen[t.deck]){seen[t.deck]=1;order.push(t.deck)} });
  return order.map((name,i)=>{
    const m=meta[name]||{name,src:'import'};
    const themes=allThemes().filter(t=>t.deck===name);
    const finish=(typeof DEV!=='undefined'&&DEV.finish)||m.finish||FINISH_CYCLE[i%FINISH_CYCLE.length];
    return {name, finish, desc:m.desc||'', src:m.src, themes};
  });
}
const deckMeta=name=>deckList().find(d=>d.name===name)||{name,finish:'craie',themes:[]};
const lib=()=>allThemes().filter(t=>S.on[t.deck]);
const activeDecks=()=>deckList().filter(d=>S.on[d.name]&&d.themes.length).map(d=>d.name);

/* ================= Import Excel ================= */
function parseSheet(rows, sheetName, out, defDeck){
  let hi=-1;
  for(let r=0;r<Math.min(rows.length,10);r++){
    const h=(rows[r]||[]).map(norm);
    if(h.some(x=>x.startsWith('theme')) && h.some(x=>x.startsWith('question')||/^q\s*\d+$/.test(x))){hi=r;break}
    if(h.some(x=>x.startsWith('deck')) && h.some(x=>x.startsWith('finition')||x.startsWith('couleur'))){
      const di=h.findIndex(x=>x.startsWith('deck')), fi=h.findIndex(x=>x.startsWith('finition')||x.startsWith('couleur')), si=h.findIndex(x=>x.startsWith('desc'));
      for(let k=r+1;k<rows.length;k++){
        const row=rows[k]||[]; const name=String(row[di]??'').trim(); if(!name) continue;
        const f=finishFrom(row[fi]);
        if(String(row[fi]??'').trim()&&!f) out.warnings.push(`${sheetName}, ligne ${k+1} : finition « ${row[fi]} » inconnue, une finition sera choisie au hasard.`);
        out.decks[name]={...(f?{finish:f}:{}),...(si>=0&&String(row[si]??'').trim()?{desc:String(row[si]).trim()}:{})};
      }
      return;
    }
  }
  if(hi<0) return;
  const H=(rows[hi]).map(norm);
  const col=f=>H.findIndex(f);
  let di=col(x=>x.startsWith('deck')||x.startsWith('paquet'));
  if(di<0) di=col(x=>x.startsWith('cat'));
  const ti=col(x=>x.startsWith('theme')), ni=col(x=>x.startsWith('niv')||x.startsWith('level'));
  const map={};
  const get=(deck,name)=>{const k=deck+'|'+norm(name);return map[k]||(map[k]={deck,name:String(name).trim(),qs:Array(10).fill(null)})};
  let lastDeck=null,lastTheme=null;
  if(ni>=0){
    const qi=col(x=>x.startsWith('question')), ri=col(x=>x.startsWith('rep')||x.startsWith('answer'));
    for(let r=hi+1;r<rows.length;r++){
      const row=rows[r]||[]; const line=r+1;
      if(!row.some(v=>String(v??'').trim())) continue;
      const themeName=String(row[ti]??'').trim()||lastTheme;
      const cell=di>=0?String(row[di]??'').trim():'';
      const deck=cell||(themeName===lastTheme&&lastDeck)||lastDeck||defDeck;
      const lv=parseInt(row[ni],10), q=String(row[qi]??'').trim(), a=String(row[ri]??'').trim();
      if(!q&&!a) continue;
      if(!themeName){out.warnings.push(`${sheetName}, ligne ${line} : thème manquant, ligne ignorée.`);continue}
      lastTheme=themeName;lastDeck=deck;
      if(!(lv>=1&&lv<=10)){out.warnings.push(`${sheetName}, ligne ${line} : niveau « ${row[ni]??''} » invalide (1 à 10).`);continue}
      if(!q||!a){out.warnings.push(`${sheetName}, ligne ${line} : question ou réponse vide.`);continue}
      get(deck,themeName).qs[lv-1]={q,a};
    }
  } else {
    const qc={},rc={};
    H.forEach((h,i)=>{let m=h.match(/^(?:q|question)\s*(\d+)$/);if(m)qc[+m[1]]=i;m=h.match(/^(?:r|rep|reponse|answer)\s*(\d+)$/);if(m)rc[+m[1]]=i});
    for(let r=hi+1;r<rows.length;r++){
      const row=rows[r]||[];
      const themeName=String(row[ti]??'').trim(); if(!themeName) continue;
      const deck=(di>=0&&String(row[di]??'').trim())||defDeck;
      const t=get(deck,themeName);
      for(let l=1;l<=10;l++){const q=String(row[qc[l]]??'').trim(),a=String(row[rc[l]]??'').trim();if(q&&a)t.qs[l-1]={q,a}}
    }
  }
  Object.values(map).forEach(t=>{
    const n=t.qs.filter(Boolean).length;
    if(!n) return;
    if(n<10) out.warnings.push(`« ${t.name} » : ${n}/10 niveaux remplis, les autres seront grisés.`);
    out.themes.push(t);
  });
}
function parseWorkbook(buf, defDeck){
  const out={themes:[],decks:{},warnings:[]};
  const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
  wb.SheetNames.forEach(n=>parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}),n,out,defDeck));
  return out;
}
function loadBank(){
  if(!window.XLSX){S.bankStatus='error';render();return}
  fetch('themes.xlsx',{cache:'no-cache'})
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()})
    .then(buf=>{
      const out=parseWorkbook(buf,'Banque');
      BANK=out.themes.map((t,i)=>({id:'b'+i,src:'banque',...t}));
      BANK_DECKS=out.decks;
      S.bankStatus=BANK.length?'ok':'error';
    })
    .catch(()=>{S.bankStatus='error'})
    .finally(()=>{if(['home','decks'].includes(S.screen))render()});
}
function importFile(file){
  if(!window.XLSX){S.report={file:file.name,added:0,warnings:['La lecture Excel n’a pas pu se charger. Vérifiez la connexion puis réessayez.']};render();return}
  const fr=new FileReader();
  fr.onload=()=>{
    let out={themes:[],decks:{},warnings:[]};
    const base=file.name.replace(/\.[^.]+$/,'');
    try{ out=parseWorkbook(fr.result,base); }
    catch(e){out.warnings.push('Fichier illisible : enregistrez-le en .xlsx et réessayez.')}
    let added=0,replaced=0;
    out.themes.forEach(t=>{
      const i=IMPORTS.findIndex(x=>x.deck===t.deck&&norm(x.name)===norm(t.name));
      const obj={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),src:file.name,...t};
      if(i>=0){IMPORTS[i]=obj;replaced++}else{IMPORTS.push(obj);added++}
    });
    Object.assign(IMPORT_DECKS,out.decks);
    const decks=[...new Set(out.themes.map(t=>t.deck))];
    decks.forEach(d=>S.on[d]=true);
    if(!out.themes.length&&!out.warnings.length) out.warnings.push('Aucune carte trouvée. La première ligne doit contenir les colonnes Deck, Thème, Niveau, Question, Réponse.');
    saveImports();
    S.report={file:file.name,added,replaced,decks,warnings:out.warnings};
    render();
  };
  fr.readAsArrayBuffer(file);
}

/* ================= Logique de jeu ================= */
function draw(deck, exclude){
  const L=lib();
  let pool=L.filter(t=>t.deck===deck&&!S.used.includes(t.id)&&t.id!==exclude);
  if(!pool.length){S.used=S.used.filter(id=>L.find(t=>t.id===id)?.deck!==deck);pool=L.filter(t=>t.deck===deck&&t.id!==exclude)}
  if(!pool.length) pool=L.filter(t=>t.deck===deck);
  if(!pool.length) pool=L.filter(t=>!S.used.includes(t.id)&&t.id!==exclude);
  if(!pool.length) pool=L;
  const t=rnd(pool); S.used.push(t.id); return t;
}
function beginTurn(){
  stopTimer();
  S.level=null;
  const decks=activeDecks();
  S.theme=draw(decks[S.deckTurn%decks.length]);
  S.phase='pick';
}
function choose(l){
  if(S.phase!=='pick') return;
  if(!S.theme.qs[l-1]) return;
  S.level=l; S.phase='question'; startTimer(); render();
}
function reveal(){ if(S.phase!=='question') return; S.phase='answer'; stopTimer(); render(); }
function totalTurns(){ return S.rounds*S.teams.length }
function finish(){ stopTimer(); S.screen='win'; render(); }
function resolve(ok){
  if(S.phase!=='answer') return;
  S.history.push({scores:S.teams.map(t=>t.score),cur:S.cur,turn:S.turn,deckTurn:S.deckTurn,used:[...S.used]});
  const t=team();
  if(ok){ t.score+=S.level; S.flash=`<b>${esc(t.name)}</b> marque ${S.level} point${S.level>1?'s':''}.`; }
  else S.flash=S.level>=7?`<b>CON.</b> ${esc(t.name)} visait ${S.level} et repart avec zéro.`:`<b>${esc(t.name)}</b> ne marque rien.`;
  if(S.mode==='points'&&t.score>=S.goal) return finish();
  S.turn++; S.deckTurn++;
  if(S.mode==='rounds'&&S.turn>=totalTurns()) return finish();
  S.cur=(S.cur+1)%S.teams.length;
  beginTurn(); render();
}
function undo(){
  const h=S.history.pop(); if(!h) return;
  S.teams.forEach((t,i)=>t.score=h.scores[i]); S.cur=h.cur; S.turn=h.turn; S.deckTurn=h.deckTurn; S.used=h.used;
  S.screen='game'; S.flash='Dernier coup annulé.'; beginTurn(); render();
}
function startGame(){
  S.error='';
  S.teams.forEach((t,i)=>{if(!t.name.trim())t.name=W().def+' '+(i+1)});
  if(S.teams.length<2){S.error=S.play==='solo'?'Il faut au moins deux joueurs.':'Il faut au moins deux équipes.';render();return}
  if(!activeDecks().length){S.error='Ajoute au moins un deck à la partie.';S.screen='decks';render();return}
  S.teams.forEach(t=>t.score=0);
  S.cur=0;S.turn=0;S.deckTurn=Math.floor(Math.random()*activeDecks().length);S.used=[];S.history=[];S.flash='';
  S.screen='game'; beginTurn(); render();
}

/* ================= Chrono ================= */
function startTimer(){ stopTimer(); if(!S.timer) return; deadline=Date.now()+S.timer*1000; tick=setInterval(updTimer,200); }
function stopTimer(){ if(tick){clearInterval(tick);tick=null} }
function updTimer(){
  const left=Math.max(0,deadline-Date.now()), bar=document.getElementById('tbar'), num=document.getElementById('tnum'), row=document.getElementById('trow');
  if(!bar) return;
  bar.style.width=(left/(S.timer*1000)*100)+'%';
  num.textContent=left>0?Math.ceil(left/1000)+' s':'Temps écoulé';
  row.classList.toggle('out',left===0);
  if(left===0) stopTimer();
}

        </div>
        <div class="ub-piece ub-top ${f.fx}" style="background:${f.bg};clip-path:${topClip}"><span class="crimp"></span><span class="ub-notch">◀ déchirer ici</span></div>
        <svg class="ub-line" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline class="guide" points="${poly}"/></svg>
        <svg class="ub-cut" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${poly}"/></svg>
      </div>
      <p class="ub-hint">Glisse le long du haut pour déchirer, ou clique</p>
      <div class="ub-cards">${cards}</div>
    </div>
    <div class="ub-info">
      <h3>${esc(d.name)}</h3>
      ${d.desc?`<p>${esc(d.desc)}</p>`:''}
      <div class="actions"><button class="btn ${S.on[name]?'':'primary'}" data-u="toggle">${S.on[name]?'Retirer de la partie':'Ajouter à la partie'}</button><button class="btn ghost" data-u="close">Fermer</button></div>
    </div>
  </div>`;
  box.hidden=false; box.dataset.deck=name; box.style.setProperty('--n',d.themes.length);
  box.className='unbox'+(reduce||(SEEN[name]&&!DEV.always)?' opened done quick':'');
  requestAnimationFrame(()=>box.classList.add('in'));
  const pack=box.querySelector('.ub-pack');
  pack.focus();
  // déchirure au doigt ou à la souris
  pack.addEventListener('pointerdown',e=>{ if(UB.tearing) return; const r=pack.getBoundingClientRect(); UB.drag={x0:e.clientX,r,moved:false}; pack.setPointerCapture(e.pointerId); });
  pack.addEventListener('pointermove',e=>{
    if(!UB.drag||UB.tearing) return;
    const p=Math.max(0,Math.min(1,(e.clientX-UB.drag.r.left)/UB.drag.r.width));
    if(Math.abs(e.clientX-UB.drag.x0)>8) UB.drag.moved=true;
    if(UB.drag.moved){ box.style.setProperty('--p',p.toFixed(3)); box.classList.add('dragging'); if(p>.85) tearPack(true); }
  });
  pack.addEventListener('pointerup',()=>{ if(!UB.drag) return; const moved=UB.drag.moved; UB.drag=null; box.classList.remove('dragging'); if(!moved) tearPack(false); else if(!UB.tearing) box.style.setProperty('--p',0); });
  pack.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();tearPack(false)} });
}
function tearPack(fromDrag){
  const box=document.getElementById('unbox');
  if(UB.tearing||box.classList.contains('opened')) return;
  UB.tearing=true; UB.drag=null; box.classList.remove('dragging');
  const k=1/DEV.speed; const lineMs=Math.round((fromDrag?120:DEV.tear)*k);
  box.classList.add('tearing'); box.style.setProperty('--lineMs',lineMs+'ms'); box.style.setProperty('--p',1);
  ubLater(()=>box.classList.add('torn'),lineMs);
  ubLater(()=>box.classList.add('burst'),lineMs+260*k);
  ubLater(()=>box.classList.add('opened'),lineMs+900*k);
  const n=+box.style.getPropertyValue('--n')||1;
  ubLater(()=>box.classList.add('done'),lineMs+(900+n*DEV.stagger+900)*k);
  SEEN[box.dataset.deck]=1; try{localStorage.setItem('connoisseur.seen',JSON.stringify(SEEN))}catch(e){}
}
function closePack(){ UB.timers.forEach(clearTimeout); UB.timers=[]; const box=document.getElementById('unbox'); box.hidden=true; box.innerHTML=''; box.className='unbox'; box.removeAttribute('style'); }
document.getElementById('unbox').addEventListener('click',e=>{
  const box=e.currentTarget;
  if(e.target===box) return closePack();
  const b=e.target.closest('[data-u]'); if(!b||b.dataset.u==='tear') return;
  const u=b.dataset.u, name=box.dataset.deck;
  if(u==='close') closePack();
  else if(u==='toggle'){ if(S.on[name])delete S.on[name]; else S.on[name]=true; S.error=''; closePack(); render(); }
});

function viewScores(){
  const max=S.mode==='points'?S.goal:Math.max(1,...S.teams.map(t=>t.score));
  const rows=S.teams.map((t,i)=>`<div class="srow ${i===S.cur?'cur':''}">
    <span class="pawn-s" style="background:${t.color}"></span>
    <span class="nm">${esc(t.name)}</span>
    <span class="pts">${t.score}${S.mode==='points'?`<small>/ ${S.goal}</small>`:''}</span>
    <span class="bar"><i style="width:${Math.min(100,t.score/max*100)}%;background:${t.color}"></i></span>
  </div>`).join('');
  const info=S.mode==='points'?`Premier à ${S.goal} points`:`Tour ${Math.min(S.rounds,Math.floor(S.turn/S.teams.length)+1)} / ${S.rounds}`;
  return `<div class="scoreboard"><span class="round">${info}</span>${rows}</div>`;
}
function viewCard(){
  const th=S.theme, d=deckMeta(th.deck), f=finishOf(d.finish);
  const idx=Math.max(1,d.themes.findIndex(t=>t.id===th.id)+1);
  const pick=S.phase==='pick', qa=pick?null:th.qs[S.level-1];
  let text, actions;
  if(pick){
    text=`<div class="tcg-levels">${Array.from({length:10},(_,i)=>`<button class="gem" data-a="lv" data-l="${i+1}" ${th.qs[i]?'':'disabled'}>${i+1}</button>`).join('')}</div>`;
    actions=`<button class="btn ghost" data-a="skip">Changer de carte</button>`;
  } else if(S.phase==='question'){
    const timer=S.timer?`<div class="timer-row" id="trow"><div class="timer"><i id="tbar" style="width:100%"></i></div><span id="tnum">${S.timer} s</span></div>`:'';
    text=`<p class="tcg-q">${esc(qa.q)}</p>${timer}`;
    actions=`<button class="btn primary" data-a="reveal">Voir la réponse <span class="kbd">Espace</span></button>`;
  } else {
    text=`<p class="tcg-q">${esc(qa.q)}</p><div class="tcg-a"><small>Réponse</small>${esc(qa.a)}</div>`;
    actions=`<button class="btn ok" data-a="ok">Juste · +${S.level} <span class="kbd">J</span></button><button class="btn ko" data-a="ko">Faux <span class="kbd">F</span></button>`;
  }
  const art=pick
    ? `<span class="art-kicker">T’es con ou connoisseur en…</span><b class="art-theme">${esc(th.name)}</b>`
    : `<span class="art-kicker">Niveau</span><b class="art-num">${S.level}</b>`;
  return `<article class="tcg ${f.fx} ${pick?'deal':''}" style="background:${f.bg}">
    <div class="tcg-in">
      <header class="tcg-title"><h2>${esc(th.name)}</h2><span class="cost" style="background:${f.bg}">${pick?'?':S.level}</span></header>
      <div class="tcg-art ${f.fx}" style="background:${f.bg}">${art}</div>
      <div class="tcg-type"><span>Carte · ${esc(th.deck)}</span><span>◆ ${idx}/${d.themes.length}</span></div>
      <div class="tcg-text">${text}</div>
      <footer class="tcg-foot"><span><em>CON</em>NOISSEUR</span><span>${pick?'Choisis ta note':'Niv. '+S.level+' · '+(S.level*1)+' pt'+(S.level>1?'s':'')}</span></footer>
    </div>
  </article>
  <div class="actions tcg-actions">${actions}</div>`;
}
function viewGame(){
  const t=team();
  return `
  <div class="topbar">
    <span class="brand"><em>CON</em>NOISSEUR</span>
    <div class="actions">
      <button class="btn small ghost" data-a="undo" ${S.history.length?'':'disabled'}>Annuler le coup</button>
      <button class="btn small ghost" data-a="go" data-v="decks">Decks</button>
      <button class="btn small ghost" data-a="menu">Menu</button>
    </div>
  </div>
  <div class="game">
    <div class="side">${viewScores()}</div>
    <div class="side play">
      <div class="turn"><span class="pawn-s" style="background:${t.color}"></span><span>Au tour de <b>${esc(t.name)}</b></span></div>
      <div class="flash">${S.flash}</div>
      ${viewCard()}
      <span class="shortcuts">Clavier : 1 à 9 et 0 pour 10 · Espace révèle · J juste · F faux</span>
    </div>
  </div>`;
}
function viewWin(){
  const ranked=[...S.teams].sort((a,b)=>b.score-a.score);
  const top=ranked.filter(t=>t.score===ranked[0].score);
  const title=top.length>1?'Égalité':esc(top[0].name);
  const sub=top.length>1?`${top.map(t=>esc(t.name)).join(' et ')} terminent avec ${top[0].score} points.`:`${top[0].score} points.`;
  return `<section class="win">
    <div class="confetti">${['irise','or','neon','metal'].map(k=>`<span class="${FINISHES[k].fx}" style="background:${FINISHES[k].bg}"></span>`).join('')}</div>
    <span class="label">${top.length>1?'Fin de partie':'Victoire'}</span>
    <h1>${title}</h1>
    <p class="hint">${sub}</p>
    <div class="ranking">${ranked.map((t,i)=>`<div><span>${i+1}. ${esc(t.name)}</span><b>${t.score} pts</b></div>`).join('')}</div>
    <div class="actions"><button class="btn primary" data-a="replay">Rejouer avec ${S.play==='solo'?'les mêmes joueurs':'les mêmes équipes'}</button><button class="btn" data-a="undo" ${S.history.length?'':'disabled'}>Annuler le dernier coup</button><button class="btn" data-a="go" data-v="decks">Changer de decks</button><button class="btn ghost" data-a="menu">Retour au menu</button></div>
  </section>`;
}

/* ================= Événements ================= */
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  const a=b.dataset.a;
  if(a==='set'){const v=b.dataset.v;S[b.dataset.k]=isNaN(+v)?v:+v;render()}
  else if(a==='mode-play'){const to=b.dataset.v;if(to!==S.play){S.teams.forEach((t,i)=>{if(t.name===DEFAULTS[S.play][i]||t.name===W().def+' '+(i+1))t.name=DEFAULTS[to][i]||((to==='solo'?'Joueur ':'Équipe ')+(i+1))});S.play=to;S.teams=S.teams.slice(0,MAX[to])}S.screen='setup';render();scrollTo(0,0)}
  else if(a==='go'){stopTimer();S.screen=b.dataset.v;S.error='';render();scrollTo(0,0)}
  else if(a==='open'){openPack(b.dataset.d)}
  else if(a==='deck'){const d=b.dataset.d;if(S.on[d])delete S.on[d];else S.on[d]=true;S.error='';render()}
  else if(a==='all-on'){deckList().forEach(d=>S.on[d.name]=true);render()}
  else if(a==='all-off'){S.on={};render()}
  else if(a==='color'){const t=S.teams[+b.dataset.i];const used=S.teams.map(x=>x.color);let k=PAWNS.indexOf(t.color);for(let n=0;n<PAWNS.length;n++){k=(k+1)%PAWNS.length;if(!used.includes(PAWNS[k]))break}t.color=PAWNS[k];render()}
  else if(a==='add-team'){const used=S.teams.map(t=>t.color);S.teams.push({name:W().def+' '+(S.teams.length+1),color:PAWNS.find(c=>!used.includes(c))||PAWNS[0],score:0});render()}
  else if(a==='rm-team'){S.teams.splice(+b.dataset.i,1);render()}
  else if(a==='import'){document.getElementById('file').click()}
  else if(a==='clear-imports'){IMPORTS.forEach(t=>delete S.on[t.deck]);IMPORTS=[];IMPORT_DECKS={};saveImports();S.report=null;render()}
  else if(a==='start'||a==='replay'){startGame()}
  else if(a==='menu'){stopTimer();S.screen='home';render();scrollTo(0,0)}
  else if(a==='lv'){choose(+b.dataset.l)}
  else if(a==='skip'){S.theme=draw(S.theme.deck,S.theme.id);render()}
  else if(a==='reveal'){reveal()}
  else if(a==='ok'){resolve(true)}
  else if(a==='ko'){resolve(false)}
  else if(a==='undo'){undo()}
});
$app.addEventListener('input',e=>{
  const i=e.target.dataset.team; if(i!==undefined) S.teams[+i].name=e.target.value;
  if(e.target.id==='deck-q'){S.q=e.target.value;applySearch()}
});
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''});
document.addEventListener('keydown',e=>{
  const box=document.getElementById('unbox');
  if(!box.hidden){ if(e.key==='Escape') closePack(); return; }
  if(S.screen!=='game'||e.target.closest('input')) return;
  if(S.phase==='pick'&&/^[0-9]$/.test(e.key)){choose(e.key==='0'?10:+e.key)}
  else if(S.phase==='question'&&(e.key===' '||e.key==='Enter')){e.preventDefault();reveal()}
  else if(S.phase==='answer'&&(e.key==='j'||e.key==='J')){resolve(true)}
  else if(S.phase==='answer'&&(e.key==='f'||e.key==='F')){resolve(false)}
});


/* ================= Panneau dev ================= */
const DEV_DEFAULT={speed:1,tear:520,stagger:160,rays:true,sparks:true,glow:true,holo:true,sheen:true,deal:true,shake:true,always:true,finish:''};
let DEV=(()=>{try{return {...DEV_DEFAULT,...JSON.parse(localStorage.getItem('connoisseur.dev')||'{}')}}catch(e){return {...DEV_DEFAULT}}})();
function saveDev(){try{localStorage.setItem('connoisseur.dev',JSON.stringify(DEV))}catch(e){}}
function applyDev(){
  const r=document.documentElement;
  r.style.setProperty('--k',(1/DEV.speed).toFixed(3));
  r.style.setProperty('--stag',DEV.stagger+'ms');
  ['rays','sparks','glow','holo','sheen','deal','shake'].forEach(k=>r.classList.toggle('no-'+k,!DEV[k]));
  r.classList.add('dev-on');
}
function devToast(t){const el=document.getElementById('dev-toast');if(el){el.textContent=t;setTimeout(()=>{if(el.textContent===t)el.textContent=''},1800)}}
function devPanel(){
  const D=deckList();
  const chk=(k,l)=>`<label><input type="checkbox" data-dev="${k}" ${DEV[k]?'checked':''}>${l}</label>`;
  return `<h4>Réglages dev <button class="icon-btn" data-devact="close" aria-label="Fermer">✕</button></h4>
    <div class="row"><span>Vitesse</span><input type="range" min="0.25" max="2.5" step="0.25" value="${DEV.speed}" data-dev="speed" aria-label="Vitesse"><b>×${DEV.speed}</b></div>
    <div class="row"><span>Déchirure</span><input type="range" min="150" max="1500" step="50" value="${DEV.tear}" data-dev="tear" aria-label="Durée de la déchirure"><b>${DEV.tear} ms</b></div>
    <div class="row"><span>Écart cartes</span><input type="range" min="40" max="500" step="20" value="${DEV.stagger}" data-dev="stagger" aria-label="Écart entre les cartes"><b>${DEV.stagger} ms</b></div>
    <div class="sep"></div>
    <div class="grid2">${chk('rays','Rayons')}${chk('sparks','Étincelles')}${chk('glow','Lumière')}${chk('holo','Reflet holo')}${chk('shake','Tremblement')}${chk('sheen','Brillance')}${chk('deal','Carte qui tourne')}${chk('always','Toujours animer')}</div>
    <div class="row"><span>Finition forcée</span><select data-dev="finish" aria-label="Finition forcée"><option value="">Aucune</option>${Object.entries(FINISHES).map(([k,f])=>`<option value="${k}" ${DEV.finish===k?'selected':''}>${f.label}</option>`).join('')}</select></div>
    <div class="sep"></div>
    <div class="row"><span>Tester</span><select id="dev-deck" aria-label="Deck à tester">${D.map(d=>`<option>${esc(d.name)}</option>`).join('')}</select></div>
    <div class="actions"><button class="btn small primary" data-devact="replay">Rejouer l’unboxing</button><button class="btn small" data-devact="seen">Reset des anims</button><button class="btn small ghost" data-devact="defaults">Réglages par défaut</button></div>
    <div class="toast" id="dev-toast"></div>`;
}
(function initDev(){
  const btn=document.createElement('button'); btn.className='dev-btn'; btn.textContent='DEV'; btn.setAttribute('aria-expanded','false');
  const pan=document.createElement('div'); pan.className='dev'; pan.hidden=true; pan.id='dev';
  document.body.append(btn,pan);
  const open=v=>{pan.hidden=!v;btn.setAttribute('aria-expanded',String(v));if(v)pan.innerHTML=devPanel()};
  btn.addEventListener('click',()=>open(pan.hidden));
  pan.addEventListener('input',e=>{
    const k=e.target.dataset.dev; if(!k) return;
    DEV[k]=e.target.type==='checkbox'?e.target.checked:(e.target.type==='range'?+e.target.value:e.target.value);
    if(e.target.type==='range'){const b=e.target.nextElementSibling;b.textContent=k==='speed'?'×'+DEV[k]:DEV[k]+' ms'}
    saveDev(); applyDev();
    if(k==='finish'&&S.screen!=='game'&&document.getElementById('unbox').hidden) render();
  });
  pan.addEventListener('click',e=>{
    const a=e.target.closest('[data-devact]')?.dataset.devact; if(!a) return;
    if(a==='close') open(false);
    else if(a==='seen'){SEEN={};try{localStorage.removeItem('connoisseur.seen')}catch(_){}closePack();devToast('Boosters refermés : l’animation rejouera partout.')}
    else if(a==='defaults'){DEV={...DEV_DEFAULT};saveDev();applyDev();open(true);render();devToast('Réglages par défaut remis.')}
    else if(a==='replay'){const n=document.getElementById('dev-deck').value;closePack();delete SEEN[n];openPack(n)}
  });
  applyDev();
})();

/* ================= Démarrage (garde la partie lors d'une mise à jour) ================= */
function start(data){
  const p=data&&data.S;
  if(p&&p.teams&&p.teams[0]&&'score' in p.teams[0]){
    S={...S,...p};
    if(!S.on||typeof S.on!=='object') S.on={};
    delete S.off;
    if(S.q===undefined) S.q='';
    if(S.deckTurn===undefined) S.deckTurn=0;
    if(S.screen==='game'&&!(S.theme&&S.theme.deck)) S.screen='setup';
    if(S.screen==='game'&&S.phase==='question') S.phase='answer';
  }
  S.bankStatus='loading';
  render(); loadBank();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
